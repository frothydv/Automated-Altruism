<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark"><title>Pantry tracker</title>
<style>html{background:#12161c}</style>
<style>/* Print layout. Mark anything that should not print with class "noprint" (or "no-print"); anything only for paper with "print-only".
   Screen colors are reset to black on white so printing works from dark mode too. */
.print-only{display:none}
@media print{
  :root,:root.light{--bg:#fff;--card:#fff;--panel:#fff;--panel2:#fff;--field:#fff;--text:#000;--muted:#333;--line:#888}
  html,body{background:#fff!important;color:#000!important;font-size:12pt}
  .noprint,.no-print,nav.tabs,.toast,#toast,.modal,button{display:none!important}
  .print-only{display:block!important}
  .card,.res,tr{break-inside:avoid;box-shadow:none}
  .print-break{break-before:page}
  .print-page{break-after:page;page-break-after:always}.print-page:last-child{break-after:auto;page-break-after:auto}
  body.printing-section .print-section:not(.print-this){display:none!important}
  table{border-collapse:collapse}th,td{border:1px solid #000;padding:6px;text-align:left;vertical-align:top}
}
</style><style>:root{--bg:#12161c;--card:#1b222b;--line:#37424f;--text:#f2f5f8;--muted:#b4bfcb;--accent:#5fd18a;--accentText:#08210f;--warn:#ffc857;--bad:#ff8a80;--field:#0e1217}
:root.light{--bg:#f6f7f4;--card:#fff;--line:#98a2ad;--text:#14181d;--muted:#46505b;--accent:#1f7a45;--accentText:#fff;--warn:#8a5a00;--bad:#b3261e;--field:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:900px;margin:0 auto;padding:12px 14px 90px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
header.top h1{font-size:1.25rem;margin:0;flex:1;min-width:160px}
h2{font-size:1.3rem;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.muted{color:var(--muted)}
button,.btn{font:inherit;min-height:48px;padding:10px 16px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accentText);border-color:var(--accent);font-weight:700}
button.danger{border-color:var(--bad);color:var(--bad)}
button.small{min-height:40px;padding:6px 12px;font-size:.95rem}
.big{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.big button{min-height:96px;font-size:1.35rem;font-weight:700}
.big button.in{background:var(--accent);color:var(--accentText);border-color:var(--accent)}
.big button.out{background:#2f6fd0;color:#fff;border-color:#2f6fd0}
:root.light .big button.out{background:#1c55b0}
nav.tabs{display:flex;gap:6px;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:6px;justify-content:center;z-index:5}
nav.tabs button{flex:1;max-width:200px;min-height:52px;border-width:2px}
nav.tabs button[aria-current=page]{background:var(--accent);color:var(--accentText);border-color:var(--accent);font-weight:700}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select,textarea{font:inherit;width:100%;min-height:48px;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--field);color:var(--text)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.actions .primary{flex:1;min-height:58px;font-size:1.2rem}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-size:.9rem}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-weight:700;font-size:.85rem;border:2px solid}
.pill.out{color:var(--bad);border-color:var(--bad)}.pill.low{color:var(--warn);border-color:var(--warn)}.pill.ok{color:var(--accent);border-color:var(--accent)}
.alert{border-left:6px solid var(--warn);padding:10px 14px;background:var(--card);border-radius:10px;margin:12px 0}
.alert.bad{border-left-color:var(--bad)}.alert.ok{border-left-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.7rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:9;display:flex;gap:14px;align-items:center;max-width:92vw}
.toast button{min-height:40px;background:transparent;color:var(--bg);border-color:var(--bg)}
.sortbtn{min-height:44px;font-weight:700;color:var(--text);background:transparent;border-color:transparent;padding:4px 8px}th.n .sortbtn{margin-left:auto}
.search{margin:8px 0}
.err{color:var(--bad);font-weight:600;margin-top:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{min-height:44px}
.chips button[aria-pressed=true]{background:var(--accent);color:var(--accentText);border-color:var(--accent)}
.sr{position:absolute;left:-9999px}
@media(max-width:560px){.big button{font-size:1.1rem}.row2{grid-template-columns:1fr}.stats b{font-size:1.3rem}}
@media print{header.top{display:none}}
</style></head>

<script>
/* Dark/light theme toggle. Dark is the default; light adds class "light" to <html>.
   The app keeps the choice in its own settings object ({theme: 'dark'|'light'}) and saves it however it likes.
   API: ToolkitTheme.apply(theme)  ToolkitTheme.toggle(settings) -> new theme (also applies it; caller saves settings)
        ToolkitTheme.button(theme) -> html for the button, clicks are handled by the app on [data-act=theme] */
(function (root) {
  'use strict';
  function apply(theme) {
    var light = theme === 'light', d = root.document;
    d.documentElement.classList.toggle('light', light);
    var m = d.querySelector('meta[name=color-scheme]'); if (m) m.setAttribute('content', light ? 'light' : 'dark');
    var tc = d.querySelector('meta[name=theme-color]'); if (tc) tc.setAttribute('content', light ? '#f6f7f4' : '#12161c');
  }
  function toggle(settings) { settings.theme = settings.theme === 'light' ? 'dark' : 'light'; apply(settings.theme); return settings.theme; }
  function button(theme) {
    return '<button class="small" type="button" data-act="theme" aria-label="Switch between dark and light colors">' + (theme === 'light' ? '🌙 Dark' : '☀️ Light') + '</button>';
  }
  var api = { apply: apply, toggle: toggle, button: button };
  root.ToolkitTheme = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script><script>

</script><script>
/* Forgiving dates for forms. ToolkitDates.parse('10/9/26') -> '2026-10-09' (or '' if it is not a date).
   Accepts 2026-10-09, 10/9/2026, 10/9/26, 10-9 (this year), "Oct 9 2026", "9 Oct 2026", and month + year only
   ("10/2027", "Oct 2027") which means the LAST day of that month (how best-by dates on cans are usually read).
   Also: iso(Date), today(), addDays(iso, n), daysBetween(fromIso, toIso), describe(days). Works in browser and Node. */
(function (root) {
  'use strict';
  var MONTHS = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function today() { return iso(new Date()); }
  function addDays(s, n) { var d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); }
  function daysBetween(a, b) { return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000); }
  function build(y, mo, d) {
    if (y < 100) y += 2000;
    var dt = new Date(y, mo - 1, d);
    return dt.getFullYear() === y && dt.getMonth() === mo - 1 && dt.getDate() === d ? iso(dt) : '';
  }
  function monthNum(w) { var i = MONTHS.indexOf(String(w).slice(0, 3).toLowerCase()); return i < 0 ? 0 : i + 1; }
  function lastDay(y, mo) { if (y < 100) y += 2000; return new Date(y, mo, 0).getDate(); }

  function parse(s) {
    s = String(s == null ? '' : s).replace(/[,\s]+/g, ' ').trim(); if (!s) return '';
    var m, y = new Date().getFullYear();
    if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) return build(+m[1], +m[2], +m[3]);
    if ((m = s.match(/^(\d{1,2})[\/.-](\d{4})$/))) return +m[1] >= 1 && +m[1] <= 12 ? build(+m[2], +m[1], lastDay(+m[2], +m[1])) : '';
    if ((m = s.match(/^(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2}|\d{4}))?$/))) return build(m[3] ? +m[3] : y, +m[1], +m[2]);
    if ((m = s.match(/^([A-Za-z]{3,9})\.? (\d{4})$/)) && monthNum(m[1])) return build(+m[2], monthNum(m[1]), lastDay(+m[2], monthNum(m[1])));
    if ((m = s.match(/^([A-Za-z]{3,9})\.? (\d{1,2})(?: (\d{2}|\d{4}))?$/)) && monthNum(m[1])) return build(m[3] ? +m[3] : y, monthNum(m[1]), +m[2]);
    if ((m = s.match(/^(\d{1,2}) ([A-Za-z]{3,9})\.?(?: (\d{2}|\d{4}))?$/)) && monthNum(m[2])) return build(m[3] ? +m[3] : y, monthNum(m[2]), +m[1]);
    return '';
  }

  /* 3 -> "3 days left", 1 -> "1 day left", 0 -> "today", -2 -> "2 days past" */
  function describe(days) {
    if (days === 0) return 'today';
    var n = Math.abs(days); return n + (n === 1 ? ' day ' : ' days ') + (days > 0 ? 'left' : 'past');
  }

  if (typeof module !== 'undefined' && module.exports) module.exports = root.ToolkitDates;

</script><script>
/* CSV export for spreadsheets. Works in the browser and in Node (core logic can require it).
   cell(v)  - one safe cell: quotes when needed, and defuses leading = + - @ so spreadsheets never run it as a formula
   fromRows(rows) - array of arrays -> CSV text with Windows line breaks
   parse(text) - the reverse: CSV text -> array of arrays. Handles quotes, line breaks inside cells, a byte-order mark, and , ; or tab separators.
     Undoes the formula guard (a leading ' before = + - @) so a file this tool exported reads back unchanged.
   download(filename, rows) - saves the file with a byte-order mark so Excel shows accents correctly (needs file-download) */
(function (root) {
  'use strict';
  function cell(v) { v = String(v == null ? '' : v); if (/^[=+\-@]/.test(v)) v = "'" + v; return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  function fromRows(rows) { return rows.map(function (r) { return r.map(cell).join(','); }).join('\r\n'); }
  function download(name, rows) { root.ToolkitDownload.save(name, '﻿' + fromRows(rows), 'text/csv'); }
  function parse(text) {
    text = String(text == null ? '' : text).replace(/^\uFEFF/, '');
    var first = text.split(/\r?\n/, 1)[0], best = ',', bn = -1;
    [',', ';', '\t'].forEach(function (d) { var n = first.split(d).length; if (n > 1 && n > bn) { best = d; bn = n; } });
    var rows = [], row = [], c = '', q = false, i, ch;
    for (i = 0; i < text.length; i++) {
      ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { c += '"'; i++; } else q = false; } else c += ch; }
      else if (ch === '"' && c === '') q = true;
      else if (ch === best) { row.push(c); c = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(c); c = ''; rows.push(row); row = []; }
      else c += ch;
    }
    if (c !== '' || row.length) { row.push(c); rows.push(row); }
    return rows.map(function (r) { return r.map(function (v) { return /^'[=+\-@]/.test(v) ? v.slice(1) : v; }); })
      .filter(function (r) { return r.length > 1 || (r.length === 1 && r[0].trim() !== ''); });
  }
  var api = { cell: cell, fromRows: fromRows, parse: parse, download: download };
  root.ToolkitCsv = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script><script>
/* One-click backup and restore as a small .json file (needs file-download).
   save({app, filename, data, settings}) - downloads {app, savedAt, settings, data}
   read(file, cb) - cb(null, {data, settings, app}) or cb(error). Also accepts older backups (bare data, or {data, org}).
   The app then validates `data` with its own sanitize(), asks "Replace what you have?" and offers undo.
   fileInput(id) - html for the hidden file chooser; pick(id) opens it. */
(function (root) {
  'use strict';
  function save(o) {
    root.ToolkitDownload.save(o.filename, JSON.stringify({ app: o.app || '', savedAt: new Date().toISOString(), settings: o.settings || {}, data: o.data }, null, 1), 'application/json');
  }
  function parse(text) {
    var j = JSON.parse(text); if (!j || typeof j !== 'object') throw new Error('not a backup');
    var settings = j.settings && typeof j.settings === 'object' ? j.settings : (j.org ? { org: j.org } : {});
    return { data: j.data || j, settings: settings, app: j.app || '' };
  }
  function read(file, cb) {
    var fr = new FileReader();
    fr.onload = function () { var r; try { r = parse(fr.result); } catch (e) { return cb(e); } cb(null, r); };
    fr.onerror = function () { cb(new Error('could not read file')); };
    fr.readAsText(file);
  }
  function fileInput(id) { return '<input id="' + id + '" type="file" accept=".json,application/json" class="sr" tabindex="-1" aria-label="Choose backup file">'; }
  function pick(id) { root.document.getElementById(id).click(); }
  var api = { save: save, parse: parse, read: read, fileInput: fileInput, pick: pick };
  root.ToolkitBackup = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script><script>
/* ToolkitPrint.print(title) opens the browser print window; the title becomes the suggested file name when saving as PDF. */
(function (root) {
  'use strict';
  function print(title) {
    var d = root.document, old = d.title; if (title) d.title = title;
    try { root.print(); } finally { d.title = old; }
  }
  /* Print just one part of the page: mark each part class="print-section" and give the one to print data-section="name". */
  function printSection(title, name) {
    var d = root.document, els = d.querySelectorAll('.print-section'), i;
    for (i = 0; i < els.length; i++) if (els[i].getAttribute('data-section') === name) els[i].classList.add('print-this');
    d.body.classList.add('printing-section');
    try { print(title); } finally {
      d.body.classList.remove('printing-section');
      for (i = 0; i < els.length; i++) els[i].classList.remove('print-this');
    }
  }
  root.ToolkitPrint = { print: print, printSection: printSection };
  if (typeof module !== 'undefined' && module.exports) module.exports = root.ToolkitPrint;

</script><script>
/* Guided first-run welcome: a short "do these 2-3 things first" panel.
   ToolkitWelcome.html({title, intro, steps:[...], doneLabel, doneAct, card:true}) -> html string.
   steps/intro are trusted html written by the app author (use <b> for the thing to tap). The done button carries data-act=doneAct
   (default "welcomeOff"); the app hides the welcome, remembers that in its settings, and offers "Show the welcome again" somewhere under More. */
(function (root) {
  'use strict';
  function html(o) {
    var inner = '<h2' + (o.card === false ? '' : ' style="margin-top:0"') + '>' + (o.title || 'Welcome!') + '</h2>' + (o.intro ? '<p>' + o.intro + '</p>' : '') +
      '<ol class="steps">' + (o.steps || []).map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ol>' +
      '<button class="primary" type="button" data-act="' + (o.doneAct || 'welcomeOff') + '">' + (o.doneLabel || 'Got it, let’s start') + '</button>';
    return o.card === false ? inner : '<div class="card" role="region" aria-label="Welcome">' + inner + '</div>';
  }
  root.ToolkitWelcome = { html: html };
  if (typeof module !== 'undefined' && module.exports) module.exports = root.ToolkitWelcome;
})(typeof window !== 'undefined' ? window : globalThis);

</script><script>
/* Practice data helper: remembers which settings a tool filled with made-up values, and clears them on "start fresh".
   Plain script (global ToolkitPracticeData) or require(). No storage of its own: it works on the tool's settings object.
   Settings are cleared only when they still hold the practice value, so a name the charity typed is never touched. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory(); else root.ToolkitPracticeData = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  function flags(opts) {
    var f = (opts && opts.flags) || {}, o = {};
    ['sample', 'welcome'].forEach(function (n) { o[n] = f[n] === null ? null : Object.assign({}, DEFAULT_FLAGS[n], f[n] || {}); });
    return o;
  }
  function same(a, b) { return JSON.stringify(a) === JSON.stringify(b); }

  /* Fill settings with practice values and remember them. values: {org: 'Example Pantry', ...}. Sets the practice banner and welcome flags. */
  function seed(settings, values, opts) {

    settings[MARK] = Object.assign(settings[MARK] || {}, rec);
    if (f.sample) settings[f.sample.key] = f.sample.practice;
    if (f.welcome) settings[f.welcome.key] = f.welcome.practice;
    return settings;
  }

  /* Which setting keys still hold a practice value? Checks what seed() recorded, plus opts.legacy ({key: [values]}) for data saved
     before this component existed. */
  function practiceKeys(settings, opts) {
    var rec = settings[MARK] || {}, legacy = (opts && opts.legacy) || {}, out = [];
    Object.keys(rec).concat(Object.keys(legacy)).forEach(function (k) {
      if (out.indexOf(k) >= 0 || settings[k] === undefined) return;
      var cands = [rec[k]].concat(legacy[k] || []).filter(function (v) { return v !== undefined; });
      if (cands.some(function (v) { return same(v, settings[k]); })) out.push(k);

     Returns {cleared: [keys], kept: [keys the charity changed]}. */
  function clearSettings(settings, opts) {
    var f = flags(opts), blank = opts && 'blank' in opts ? opts.blank : '', rec = settings[MARK] || {}, legacy = (opts && opts.legacy) || {};
    var cleared = practiceKeys(settings, opts), kept = Object.keys(rec).concat(Object.keys(legacy)).filter(function (k, i, a) {
      return a.indexOf(k) === i && cleared.indexOf(k) < 0 && settings[k] !== undefined && settings[k] !== blank;
    });

    delete settings[MARK];
    if (f.sample) settings[f.sample.key] = f.sample.fresh;
    if (f.welcome) settings[f.welcome.key] = f.welcome.fresh;
    return { cleared: cleared, kept: kept };
  }

  /* One undoable step. state = {data, settings}; opts.empty = function returning empty data (or the empty data itself);
     opts.onSettings(settings) may reset other things such as a current-event id. Mutates settings in place; returns
     {data, cleared, kept, undo} where undo is a string for restore(). */
  function startFresh(state, opts) {
    var undo = snapshot(state), r = clearSettings(state.settings, opts), empty = opts && opts.empty;
    if (opts && opts.onSettings) opts.onSettings(state.settings);

  }

  /* Snapshot of data AND settings, so one Undo brings back both. */
  function snapshot(state) { return JSON.stringify({ practiceData: 1, data: state.data, settings: state.settings }); }
  /* Put settings back in place (same object) and return the data to re-sanitize. Also accepts an old data-only snapshot. */
  function restore(str, settings) {
    var o = JSON.parse(str);

    Object.keys(settings).forEach(function (k) { delete settings[k]; });
    Object.assign(settings, o.settings);
    return { data: o.data };
  }

  /* True if any text field of the tool's settings still equals a known practice value (used by tests). */
  function leftovers(settings, practiceValues) {
    var vals = Array.isArray(practiceValues) ? practiceValues : Object.keys(practiceValues).map(function (k) { return practiceValues[k]; });
    return Object.keys(settings).filter(function (k) { return k !== MARK && vals.some(function (v) { return same(v, settings[k]); }); });
  }

  return { MARK: MARK, seed: seed, practiceKeys: practiceKeys, clearSettings: clearSettings, startFresh: startFresh, snapshot: snapshot, restore: restore, leftovers: leftovers };
});

</script><script>
/* Pantry core: pure logic, no DOM, no storage. Works in browser and Node.
   Data: {version, items:[{id,name,category,unit,lbPer,low}], moves:[{id,type,itemId,qty,date,donor,household,size,note,createdAt}]}
   A donation ('in') may carry bestBy (ISO date or ''); a count correction ('adj') may carry lotId (the donation it pulled from the shelf).
   unit: 'lb' (qty is pounds) or 'each' (qty is a count; lbPer = pounds in one). type: 'in' (donation) | 'out' (distribution) | 'adj' (count correction, qty may be negative; never counted as donated or served). */

</script><script>
(function () {

      '<label for="d-soon">&ldquo;Use first&rdquo; list shows food due within this many days</label><input id="d-soon" inputmode="numeric" value="' + r.soonDays + '">' +

  function stockView() {

  function readForm() {

    if ((v = g('f-best')) !== null) form.bestBy = v;
    if ((v = g('f-note')) !== null) form.note = v;
    if (form.newItem) { form.ni.name = g('n-name') || ''; form.ni.category = g('n-cat') || 'Other'; form.ni.unit = g('n-unit') || 'each'; form.ni.low = g('n-low') || ''; if (g('n-lb') !== null) form.ni.lbPer = g('n-lb'); }
  }

  function doSave(again) {
    readForm(); var f = form; f.err = '';
    if (f.type === 'out' && !P.cleanHousehold(f.household)) { f.err = 'Please enter the household ID or initials.'; return render(); }
    if (f.newItem) {
      var r0 = P.addItem(data, f.ni); if (r0.error) { f.err = r0.error; return render(); }
      f.itemId = r0.item.id; f.newItem = false;
    }
    var r = P.addMove(data, f);
    if (r.error) { f.err = r.error; return render(); }
    save();
    var item = P.findItem(data, r.move.itemId), line = qty(r.move.qty) + (item.unit === 'lb' ? ' lb ' : ' × ') + item.name;
    var id = r.move.id;
    if (again) {
      f.saved.push(line); f.itemId = ''; f.qty = ''; f.note = ''; f.bestBy = '';
      if (r.warning) f.err = r.warning;
      render(); var e = document.getElementById('f-item'); if (e) e.focus(); return;
    }
    var all = f.saved.concat([line]);
    form = null; view = 'home'; msg = r.warning || '';
    showToast('Saved: ' + all.join(', '), function () { P.removeMove(data, id); save(); });
    render();
  }

  $app.addEventListener('click', function (e) {
    var t = e.target.closest('[data-pull],[data-go],[data-act],[data-log],[data-sf],[data-del],[data-sort],[data-edit]'); if (!t) return;
    if (t.dataset.pull) {
      var pr = P.pullLot(data, t.dataset.pull, 'Pulled: past its best-by date'); if (pr.error) { msg = pr.error; return render(); }
      save(); var pm = pr.move; showToast(pr.lot.item.name + ' marked as pulled.', function () { P.removeMove(data, pm.id); save(); }); return render();
    }
    if (t.dataset.go) { form = null; return go(t.dataset.go); }
    if (t.dataset.log) { form = newForm(t.dataset.log); view = 'log'; msg = ''; window.scrollTo(0, 0); render(); var el = document.getElementById(form.type === 'out' ? 'f-household' : 'f-item'); if (el) el.focus(); return; }
    if (t.dataset.edit) {
      var it = P.findItem(data, t.dataset.edit); editId = it.id;
      editForm = { count: qty(P.stockOf(data, it.id)), low: String(it.low), name: it.name, category: it.category, lbPer: String(it.lbPer), err: '', more: false };
      return go('edit');
    }
    if (t.dataset.sort) { if (sortKey === t.dataset.sort) sortDir = -sortDir; else { sortKey = t.dataset.sort; sortDir = 1; } return render(); }
    if (t.dataset.sf) { stockFilter = t.dataset.sf; return render(); }
    if (t.dataset.del) {
      var m = P.removeMove(data, t.dataset.del); save(); showToast('Entry deleted.', function () { P.restoreMove(data, m); save(); }); return render();
    }
    var a = t.dataset.act;
    if (a === 'theme') { ToolkitTheme.toggle(settings); S.saveSettings(settings); readForm(); return render(); }
    if (a === 'welcomed') { settings.welcomed = true; S.saveSettings(settings); return render(); }
    if (a === 'saveEdit') {
      var g = function (id) { var el = document.getElementById(id); return el ? el.value : ''; };
      editForm.count = g('e-count'); editForm.low = g('e-low'); editForm.name = g('e-name'); editForm.category = g('e-cat'); if (document.getElementById('e-lb')) editForm.lbPer = g('e-lb');
      editForm.more = !!document.querySelector('details[open]');
      var u1 = P.updateItem(data, editId, editForm); if (u1.error) { editForm.err = u1.error; return render(); }
      var u2 = P.adjustStock(data, editId, editForm.count); if (u2.error) { editForm.err = u2.error; return render(); }
      save(); var mv = u2.move, nm = editForm.name;
      msg = ''; view = 'stock'; showToast(mv ? nm + ' saved. Count corrected.' : nm + ' saved.', mv ? function () { P.removeMove(data, mv.id); save(); } : null); return render();
    }
    if (a === 'saveLog') return doSave(false);
    if (a === 'saveMore') return doSave(true);
    if (a === 'toggleNew') { readForm(); form.newItem = !form.newItem; return render(); }
    if (a === 'undo') { var u = toast && toast.undo; toast = null; if (u) u(); return render(); }
    if (a === 'printPage') return ToolkitPrint.print('Pantry stock ' + P.today());
    if (a === 'printUse') return ToolkitPrint.printSection('Use these first ' + P.today(), 'use');
    if (a === 'printExpired') return ToolkitPrint.printSection('Pull these ' + P.today(), 'expired');
    if (a === 'datesCsv') return ToolkitCsv.download('pantry-dates-' + P.today() + '.csv', P.expiryRows(data, rules()));
    if (a === 'stockCsv') return ToolkitCsv.download('pantry-stock-' + P.today() + '.csv', P.stockRows(data));
    if (a === 'activityCsv') return ToolkitCsv.download('pantry-entries-' + P.today() + '.csv', P.activityRows(data));
    if (a === 'backup') { ToolkitBackup.save({ app: 'pantry-tracker', filename: 'pantry-backup-' + P.today() + '.json', data: data, settings: { org: settings.org || '', soonDays: rules().soonDays, graceDays: rules().graceDays } }); settings.lastBackup = P.today(); S.saveSettings(settings); msg = 'Backup file saved to your Downloads. Put a copy in your shared folder or on a USB stick.'; return render(); }
    if (a === 'restoreBtn') return ToolkitBackup.pick('restoreFile');
    if (a === 'sample') { if (confirm('Replace everything with made-up practice data?')) { seedPractice(); save(); S.saveSettings(settings); msg = 'Practice data loaded.'; go('home'); } return; }
    if (a === 'empty') { if (confirm('Delete ALL entries and items and start with an empty pantry? You can undo right after.')) { var fr = PD.startFresh({ data: data, settings: settings }, Object.assign({ empty: P.empty }, PRACTICE)); data = fr.data; save(); S.saveSettings(settings); msg = 'Empty pantry ready, practice name cleared. Use "Log donation" and "Not on the list? Add a new item" to begin.'; showToast('Everything cleared.', function () { data = P.sanitize(PD.restore(fr.undo, settings).data); save(); S.saveSettings(settings); msg = ''; }); go('home'); } return; }
  });
  $app.addEventListener('change', function (e) {
    if (e.target.id === 'restoreFile') {
      var file = e.target.files[0]; if (!file) return;
      ToolkitBackup.read(file, function (err, bk) {
        try {
          if (err) throw err;
          var d = P.sanitize(bk.data);
          if (!d.items.length) throw new Error('empty');
          if (!confirm('Replace what is on this tablet with the backup (' + d.items.length + ' items, ' + d.moves.length + ' entries)?')) return;
          data = d; if (bk.settings.org) settings.org = bk.settings.org; if (bk.settings.soonDays != null) { settings.soonDays = bk.settings.soonDays; settings.graceDays = bk.settings.graceDays; } save(); S.saveSettings(settings); msg = 'Backup restored.'; go('home');
        } catch (x) { msg = 'That file does not look like a pantry backup. Choose a file named pantry-backup-….json.'; render(); }
      });
      return;
    }
    if (e.target.id === 'd-soon' || e.target.id === 'd-grace') {
      settings.soonDays = document.getElementById('d-soon').value; settings.graceDays = document.getElementById('d-grace').value;
      var nr = rules(); settings.soonDays = nr.soonDays; settings.graceDays = nr.graceDays; S.saveSettings(settings); cutoffOpen = true; return render();
    }
    if (e.target.id === 'org') { settings.org = e.target.value.trim(); S.saveSettings(settings); return; }
    if (view !== 'log' || !form) return;
    var id = e.target.id; readForm();
    if (id === 'f-household' && form.type === 'out') { var s = P.lastSize(data, form.household); if (s && !form.size) { form.size = String(s); document.getElementById('f-size').value = form.size; } }
    if (id === 'n-unit') render();
  });
  $app.addEventListener('input', function (e) { if (e.target.id === 'search') { filter = e.target.value; render(); } });
  $app.addEventListener('keydown', function (e) { if (e.key === 'Enter' && view === 'log' && e.target.tagName === 'INPUT') { e.preventDefault(); doSave(false); } });
  render();
})();

</script>
</body></html>
