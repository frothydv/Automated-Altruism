<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark"><title>Pantry tracker</title>
<style>html{background:#12161c}</style>
<style>:root{--bg:#12161c;--card:#1b222b;--line:#37424f;--text:#f2f5f8;--muted:#b4bfcb;--accent:#5fd18a;--accentText:#08210f;--warn:#ffc857;--bad:#ff8a80;--field:#0e1217}
:root.light{--bg:#f6f7f4;--card:#fff;--line:#98a2ad;--text:#14181d;--muted:#46505b;--accent:#1f7a45;--accentText:#fff;--warn:#8a5a00;--bad:#b3261e;--field:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:900px;margin:0 auto;padding:12px 14px 90px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
header.top h1{font-size:1.25rem;margin:0;flex:1;min-width:160px}
h2{font-size:1.3rem;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.muted{color:var(--muted)}
button,.btn{font:inherit;min-height:48px;padding:10px 16px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accentText);border-color:var(--accent);font-weight:700}
button.danger{border-color:var(--bad);color:var(--bad)}
button.small{min-height:40px;padding:6px 12px;font-size:.95rem}
.big{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.big button{min-height:96px;font-size:1.35rem;font-weight:700}
.big button.in{background:var(--accent);color:var(--accentText);border-color:var(--accent)}
.big button.out{background:#2f6fd0;color:#fff;border-color:#2f6fd0}
:root.light .big button.out{background:#1c55b0}
nav.tabs{display:flex;gap:6px;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:6px;justify-content:center;z-index:5}
nav.tabs button{flex:1;max-width:200px;min-height:52px;border-width:2px}
nav.tabs button[aria-current=page]{background:var(--accent);color:var(--accentText);border-color:var(--accent);font-weight:700}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select,textarea{font:inherit;width:100%;min-height:48px;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--field);color:var(--text)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.actions .primary{flex:1;min-height:58px;font-size:1.2rem}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-size:.9rem}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-weight:700;font-size:.85rem;border:2px solid}
.pill.out{color:var(--bad);border-color:var(--bad)}.pill.low{color:var(--warn);border-color:var(--warn)}.pill.ok{color:var(--accent);border-color:var(--accent)}
.alert{border-left:6px solid var(--warn);padding:10px 14px;background:var(--card);border-radius:10px;margin:12px 0}
.alert.bad{border-left-color:var(--bad)}.alert.ok{border-left-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.7rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:9;display:flex;gap:14px;align-items:center;max-width:92vw}
.toast button{min-height:40px;background:transparent;color:var(--bg);border-color:var(--bg)}
.sortbtn{min-height:44px;font-weight:700;color:var(--text);background:transparent;border-color:transparent;padding:4px 8px}th.n .sortbtn{margin-left:auto}
.search{margin:8px 0}
.err{color:var(--bad);font-weight:600;margin-top:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{min-height:44px}
.chips button[aria-pressed=true]{background:var(--accent);color:var(--accentText);border-color:var(--accent)}
.sr{position:absolute;left:-9999px}
@media(max-width:560px){.big button{font-size:1.1rem}.row2{grid-template-columns:1fr}.stats b{font-size:1.3rem}}
@media print{nav.tabs,.noprint,.toast{display:none!important}:root,:root.light{--bg:#fff;--card:#fff;--text:#000;--muted:#333;--line:#888}}
</style></head>
<body><div id="app"></div><noscript>This page needs JavaScript turned on to work.</noscript>
<script>
/* Pantry core: pure logic, no DOM, no storage. Works in browser and Node.
   Data: {version, items:[{id,name,category,unit,lbPer,low}], moves:[{id,type,itemId,qty,date,donor,household,size,note,createdAt}]}
   unit: 'lb' (qty is pounds) or 'each' (qty is a count; lbPer = pounds in one). type: 'in' (donation) | 'out' (distribution) | 'adj' (count correction, qty may be negative; never counted as donated or served). */
(function (root) {
  'use strict';
  var CATEGORIES = ['Canned vegetables', 'Canned protein', 'Fruit', 'Grains and pasta', 'Breakfast', 'Soup and sauce', 'Dairy and eggs', 'Fresh produce', 'Frozen', 'Baby and kids', 'Household and hygiene', 'Other'];

  function uid(p) { return (p || 'x') + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function num(v) { var n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isFinite(n) ? n : 0; }
  function round(n) { return Math.round(n * 100) / 100; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function today() { return iso(new Date()); }
  function addDays(s, n) { var d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); }
  function clean(s, max) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim().slice(0, max || 80); }

  /* Accepts 2026-10-09, 10/9/2026, 10/9/26, 10-9. Returns ISO or ''. */
  function parseDate(s) {
    s = clean(s); if (!s) return '';
    var m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/), y, mo, d;
    if (m) { y = +m[1]; mo = +m[2]; d = +m[3]; }
    else if ((m = s.match(/^(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?$/))) {
      mo = +m[1]; d = +m[2]; y = m[3] ? +m[3] : new Date().getFullYear(); if (y < 100) y += 2000;
    } else return '';
    var dt = new Date(y, mo - 1, d);
    if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return '';
    return iso(dt);
  }

  /* Household IDs are tidied to upper case: " h-014 " -> "H-014"; initials "j.s." -> "JS". */
  function cleanHousehold(s) {
    s = clean(s, 20).toUpperCase();
    if (/^([A-Z]\.?){1,4}$/.test(s)) s = s.replace(/\./g, '');
    return s;
  }

  function empty() { return { version: 1, items: [], moves: [] }; }

  function sanitize(d) {
    var out = empty();
    if (!d || typeof d !== 'object') return out;
    (Array.isArray(d.items) ? d.items : []).forEach(function (i) {
      if (!i || !clean(i.name)) return;
      out.items.push({ id: String(i.id || uid('i')), name: clean(i.name, 60), category: clean(i.category, 40) || 'Other',
        unit: i.unit === 'lb' ? 'lb' : 'each', lbPer: i.unit === 'lb' ? 1 : (num(i.lbPer) > 0 ? num(i.lbPer) : 1), low: Math.max(0, num(i.low)) });
    });
    var ids = {}; out.items.forEach(function (i) { ids[i.id] = 1; });
    (Array.isArray(d.moves) ? d.moves : []).forEach(function (m) {
      if (!m || !ids[m.itemId] || (m.type !== 'in' && m.type !== 'out' && m.type !== 'adj') || (m.type === 'adj' ? num(m.qty) === 0 : !(num(m.qty) > 0))) return;
      out.moves.push({ id: String(m.id || uid('m')), type: m.type, itemId: String(m.itemId), qty: num(m.qty), date: parseDate(m.date) || today(),
        donor: clean(m.donor, 60), household: cleanHousehold(m.household), size: Math.max(0, Math.round(num(m.size))),
        note: clean(m.note, 120), createdAt: m.createdAt || new Date().toISOString() });
    });
    return out;
  }

  function findItem(data, id) { for (var i = 0; i < data.items.length; i++) if (data.items[i].id === id) return data.items[i]; return null; }
  function unitLabel(item, qty) { return item.unit === 'lb' ? 'lb' : (qty === 1 ? 'item' : 'items'); }
  function pounds(item, qty) { return round(item.unit === 'lb' ? qty : qty * item.lbPer); }

  function addItem(data, f) {
    var name = clean(f.name, 60); if (!name) return { error: 'Please type what the item is called.' };
    var dup = data.items.filter(function (i) { return i.name.toLowerCase() === name.toLowerCase(); })[0];
    if (dup) return { error: '"' + dup.name + '" is already on the list. Choose it from the list instead.' };
    var item = { id: uid('i'), name: name, category: clean(f.category, 40) || 'Other', unit: f.unit === 'lb' ? 'lb' : 'each',
      lbPer: f.unit === 'lb' ? 1 : (num(f.lbPer) > 0 ? num(f.lbPer) : 1), low: Math.max(0, num(f.low)) };
    data.items.push(item); return { item: item };
  }

  /* f: {type,itemId,qty,date,donor,household,size,note} */
  function addMove(data, f) {
    var item = findItem(data, f.itemId);
    if (!item) return { error: 'Please choose an item.' };
    var qty = num(f.qty);
    if (!(qty > 0)) return { error: 'Please enter how many (a number bigger than zero).' };
    var date = f.date ? parseDate(f.date) : today();
    if (!date) return { error: 'That date does not look right. Try something like 10/9/2026.' };
    var warn = '';
    if (f.type === 'out' && qty > stockOf(data, item.id)) warn = 'Only ' + round(stockOf(data, item.id)) + ' ' + unitLabel(item, 2) + ' of ' + item.name + ' on the shelf by our records. Saved anyway; check the count when you can.';
    var m = { id: uid('m'), type: f.type === 'out' ? 'out' : 'in', itemId: item.id, qty: qty, date: date, donor: clean(f.donor, 60),
      household: cleanHousehold(f.household), size: Math.max(0, Math.round(num(f.size))), note: clean(f.note, 120), createdAt: new Date().toISOString() };
    data.moves.push(m); return { move: m, warning: warn };
  }

  /* Count correction: the volunteer says how many are really on the shelf; we record the difference. */
  function adjustStock(data, itemId, actual) {
    var item = findItem(data, itemId); if (!item) return { error: 'Please choose an item.' };
    if (String(actual == null ? '' : actual).trim() === '' || !isFinite(parseFloat(String(actual).replace(',', '.'))) || num(actual) < 0) return { error: 'Please type how many are on the shelf now (0 or more).' };
    var diff = round(num(actual) - stockOf(data, itemId));
    if (diff === 0) return { unchanged: true };
    var m = { id: uid('m'), type: 'adj', itemId: itemId, qty: diff, date: today(), donor: '', household: '', size: 0, note: 'Count correction', createdAt: new Date().toISOString() };
    data.moves.push(m); return { move: m };
  }

  /* f: {name, category, low, lbPer}. Changes the item's details; stock history is untouched. */
  function updateItem(data, id, f) {
    var item = findItem(data, id); if (!item) return { error: 'That item was not found.' };
    var name = clean(f.name, 60); if (!name) return { error: 'Please type what the item is called.' };
    var dup = data.items.filter(function (i) { return i.id !== id && i.name.toLowerCase() === name.toLowerCase(); })[0];
    if (dup) return { error: '"' + dup.name + '" is already on the list.' };
    item.name = name; item.category = clean(f.category, 40) || 'Other'; item.low = Math.max(0, num(f.low));
    if (item.unit !== 'lb') item.lbPer = num(f.lbPer) > 0 ? num(f.lbPer) : item.lbPer;
    return { item: item };
  }

  function removeMove(data, id) {
    for (var i = 0; i < data.moves.length; i++) if (data.moves[i].id === id) return data.moves.splice(i, 1)[0];
    return null;
  }
  function restoreMove(data, m) { if (m) data.moves.push(m); }

  function stockOf(data, itemId) {
    var s = 0; data.moves.forEach(function (m) { if (m.itemId === itemId) s += m.type === 'out' ? -m.qty : m.qty; });
    return round(s);
  }

  /* One row per item: {item, stock, lbs, status:'out'|'low'|'ok'} sorted with the most urgent first. */
  function stockList(data) {
    var rows = data.items.map(function (item) {
      var st = stockOf(data, item.id);
      var status = st <= 0 ? 'out' : (item.low > 0 && st <= item.low ? 'low' : 'ok');
      return { item: item, stock: Math.max(st, 0), lbs: pounds(item, Math.max(st, 0)), status: status };
    });
    var rank = { out: 0, low: 1, ok: 2 };
    rows.sort(function (a, b) { return rank[a.status] - rank[b.status] || a.item.name.localeCompare(b.item.name); });
    return rows;
  }

  function totals(data) {
    var lbs = 0, flagged = 0;
    stockList(data).forEach(function (r) { lbs += r.lbs; if (r.status !== 'ok') flagged++; });
    return { lbs: round(lbs), flagged: flagged, items: data.items.length };
  }

  /* Most recent first. Each row gets item and lbs for display. */
  function activity(data, limit) {
    var rows = data.moves.slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : (a.createdAt < b.createdAt ? 1 : -1); });
    rows = rows.map(function (m) { var item = findItem(data, m.itemId); return { move: m, item: item, lbs: pounds(item, m.qty) }; });
    return limit ? rows.slice(0, limit) : rows;
  }

  function knownHouseholds(data) {
    var seen = {}, list = [];
    data.moves.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).forEach(function (m) {
      if (m.household && !seen[m.household]) { seen[m.household] = 1; list.push(m.household); }
    });
    return list;
  }
  function knownDonors(data) {
    var seen = {}, list = [];
    data.moves.forEach(function (m) { if (m.donor && !seen[m.donor.toLowerCase()]) { seen[m.donor.toLowerCase()] = 1; list.push(m.donor); } });
    return list.sort();
  }
  /* Household size last used for this ID, so volunteers need not retype it. */
  function lastSize(data, household) {
    var h = cleanHousehold(household), best = null;
    data.moves.forEach(function (m) { if (m.type === 'out' && m.household === h && m.size && (!best || m.date >= best.date)) best = m; });
    return best ? best.size : 0;
  }

  function csvCell(v) { v = String(v == null ? '' : v); if (/^[=+\-@]/.test(v)) v = "'" + v; return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  function toCsv(rows) { return rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n'); }
  function stockCsv(data) {
    var rows = [['Item', 'Category', 'On shelf', 'Unit', 'Pounds', 'Low-stock level', 'Status']];
    stockList(data).forEach(function (r) { rows.push([r.item.name, r.item.category, r.stock, r.item.unit === 'lb' ? 'lb' : 'items', r.lbs, r.item.low, r.status === 'ok' ? 'OK' : r.status === 'low' ? 'Low' : 'Out']); });
    return toCsv(rows);
  }
  function activityCsv(data) {
    var rows = [['Date', 'Type', 'Item', 'Category', 'Quantity', 'Unit', 'Pounds', 'Donor', 'Household', 'Household size', 'Note']];
    activity(data).forEach(function (r) {
      var m = r.move; rows.push([m.date, m.type === 'in' ? 'Donation' : m.type === 'adj' ? 'Count correction' : 'Distribution', r.item.name, r.item.category, m.qty, r.item.unit === 'lb' ? 'lb' : 'items', r.lbs, m.donor, m.household, m.size || '', m.note]);
    });
    return toCsv(rows);
  }

  root.Pantry = { CATEGORIES: CATEGORIES, uid: uid, num: num, round: round, today: today, iso: iso, addDays: addDays, parseDate: parseDate,
    cleanHousehold: cleanHousehold, empty: empty, sanitize: sanitize, findItem: findItem, unitLabel: unitLabel, pounds: pounds, addItem: addItem,
    addMove: addMove, adjustStock: adjustStock, updateItem: updateItem, removeMove: removeMove, restoreMove: restoreMove, stockOf: stockOf, stockList: stockList, totals: totals, activity: activity,
    knownHouseholds: knownHouseholds, knownDonors: knownDonors, lastSize: lastSize, stockCsv: stockCsv, activityCsv: activityCsv };
  if (typeof module !== 'undefined' && module.exports) module.exports = root.Pantry;
})(typeof window !== 'undefined' ? window : globalThis);

</script><script>
/* Made-up sample for a small rural pantry. Dates are relative to today. No real people. */
(function (root) {
  'use strict';
  var P = root.Pantry;
  var ITEMS = [ // name, category, unit, lbPer, low
    ['Canned green beans', 'Canned vegetables', 'each', 0.9, 24], ['Canned corn', 'Canned vegetables', 'each', 0.9, 24],
    ['Canned tomatoes', 'Canned vegetables', 'each', 1.8, 12], ['Canned tuna', 'Canned protein', 'each', 0.4, 20],
    ['Peanut butter', 'Canned protein', 'each', 1.1, 12], ['Dried pinto beans (1 lb bag)', 'Canned protein', 'each', 1, 15],
    ['Canned peaches', 'Fruit', 'each', 1, 12], ['Applesauce cups', 'Fruit', 'each', 0.25, 24],
    ['Spaghetti (1 lb box)', 'Grains and pasta', 'each', 1, 20], ['White rice', 'Grains and pasta', 'lb', 1, 40],
    ['Oatmeal canisters', 'Breakfast', 'each', 1.5, 10], ['Cereal boxes', 'Breakfast', 'each', 0.8, 15],
    ['Chicken noodle soup', 'Soup and sauce', 'each', 0.7, 24], ['Pasta sauce jars', 'Soup and sauce', 'each', 1.5, 12],
    ['Eggs (dozen)', 'Dairy and eggs', 'each', 1.5, 6], ['Shelf-stable milk', 'Dairy and eggs', 'each', 2.1, 8],
    ['Potatoes', 'Fresh produce', 'lb', 1, 30], ['Apples', 'Fresh produce', 'lb', 1, 20],
    ['Frozen ground turkey', 'Frozen', 'lb', 1, 15], ['Diapers (pack)', 'Baby and kids', 'each', 2, 4],
    ['Bar soap', 'Household and hygiene', 'each', 0.3, 20], ['Toilet paper (4-roll)', 'Household and hygiene', 'each', 1.5, 6]];
  var DONORS = ['Valley Grocery', 'First Church food drive', 'Hill Farm', 'Regional Food Bank', 'Anonymous', 'Scout Troop 12', 'Grange Hall'];

  function seed(n) { var s = n || 7; return function () { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }

  root.PantrySample = {
    org: 'Maple Hollow Community Pantry',
    make: function () {
      var rnd = seed(11), d = P.empty(), ids = [];
      ITEMS.forEach(function (r) { var res = P.addItem(d, { name: r[0], category: r[1], unit: r[2], lbPer: r[3], low: r[4] }); ids.push(res.item.id); });
      var homes = []; for (var h = 1; h <= 26; h++) homes.push('H-' + (h < 10 ? '00' : '0') + h);
      homes.push('JS', 'AM', 'RT');
      var sizes = {}; homes.forEach(function (h) { sizes[h] = 1 + Math.floor(rnd() * 5); });
      function pick(a) { return a[Math.floor(rnd() * a.length)]; }
      function add(f, date) { f.date = date; var r = P.addMove(d, f); if (r.move) r.move.createdAt = date + 'T12:00:00.000Z'; }
      for (var back = 75; back >= 0; back--) {
        var dt = P.addDays(P.today(), -back), dow = new Date(dt + 'T12:00:00').getDay();
        if (dow === 2 || dow === 5) { // donation days: Tue, Fri
          for (var k = 0; k < 7; k++) {
            var ix = Math.floor(rnd() * ids.length), it = d.items[ix];
            add({ type: 'in', itemId: ids[ix], qty: it.unit === 'lb' ? 10 + Math.floor(rnd() * 40) : 6 + Math.floor(rnd() * 30), donor: pick(DONORS) }, dt);
          }
        }
        if (dow === 3 || dow === 6) { // distribution days: Wed, Sat
          var families = 4 + Math.floor(rnd() * 5);
          for (var f = 0; f < families; f++) {
            var home = pick(homes);
            for (var j = 0; j < 4 + Math.floor(rnd() * 3); j++) {
              var jx = Math.floor(rnd() * ids.length), jt = d.items[jx];
              var have = P.stockOf(d, ids[jx]); if (have <= 0) continue;
              var q = jt.unit === 'lb' ? Math.min(have, 3 + Math.floor(rnd() * 5)) : Math.min(have, 1 + Math.floor(rnd() * 4));
              add({ type: 'out', itemId: ids[jx], qty: q, household: home, size: sizes[home] }, dt);
            }
          }
        }
      }
      // make sure the demo shows a few flags
      [['Canned tuna', 4], ['Diapers (pack)', 0], ['Eggs (dozen)', 3]].forEach(function (p) {
        var it = d.items.filter(function (i) { return i.name === p[0]; })[0], have = P.stockOf(d, it.id);
        if (have > p[1]) add({ type: 'out', itemId: it.id, qty: have - p[1], household: 'H-004', size: sizes['H-004'] }, P.today());
      });
      return d;
    }
  };
})(window);

</script><script>
/* Browser storage adapter. Interface: load() -> data|null, save(data), loadSettings() -> {}, saveSettings(obj).
   Falls back to memory if the browser blocks storage (save() then returns false). */
(function (root) {
  'use strict';
  var KEY = 'pantryTracker.data.v1', SKEY = 'pantryTracker.settings.v1', mem = {};
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] || null; } }
  function set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { mem[k] = v; return false; } }
  root.PantryStorage = {
    name: 'browser',
    load: function () { var r = get(KEY); if (!r) return null; try { return root.Pantry.sanitize(JSON.parse(r)); } catch (e) { return null; } },
    save: function (d) { return set(KEY, JSON.stringify(d)); },
    loadSettings: function () { try { return JSON.parse(get(SKEY)) || {}; } catch (e) { return {}; } },
    saveSettings: function (s) { return set(SKEY, JSON.stringify(s)); }
  };
})(window);

</script><script>
(function () {

  var settings = S.loadSettings(), data = S.load(), view = 'home', form = null, toast = null, toastTimer = null, filter = '', editId = null, editForm = null, stockFilter = 'all', sortKey = 'status', sortDir = 1, msg = '';
  if (!data) { data = SAMPLE.make(); settings.org = settings.org || SAMPLE.org; settings.sample = true; S.save(data); S.saveSettings(settings); }
  var $app = document.getElementById('app');

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function qty(n) { return String(P.round(n)); }
  function niceDate(s) { var d = new Date(s + 'T12:00:00'); return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }); }
  function save() { var ok = S.save(data); if (!ok) msg = 'This browser would not save your entries. Use Back up now (under More) before closing.'; }

  }
  function newForm(type) { return { type: type, itemId: '', qty: '', date: '', donor: '', household: '', size: '', note: '', newItem: false, ni: { name: '', category: 'Other', unit: 'each', lbPer: '1', low: '' }, err: '', saved: [] }; }

  function homeView() {
    var t = P.totals(data), list = P.stockList(data).filter(function (r) { return r.status !== 'ok'; });
    var h = '';
    if (!settings.welcomed) {
      h += '<div class="card"><h2 style="margin-top:0">Welcome!</h2><p>This has made-up practice data so you can try everything safely.</p><ol><li>Tap <b>Log distribution</b> and save one for a household.</li><li>Tap <b>Stock</b> to see the shelf update and what is running low.</li><li>When you are ready, go to <b>More</b> and choose <b>Start with an empty pantry</b>.</li></ol><button class="primary" data-act="welcomed">Got it</button></div>';
    }

    h += '<div class="stats"><div class="stat"><b>' + Math.round(t.lbs).toLocaleString() + '</b>lb on shelf</div><div class="stat"><b>' + t.items + '</b>kinds of item</div><div class="stat"><b' + (t.flagged ? ' style="color:var(--warn)"' : '') + '>' + t.flagged + '</b>need restocking</div></div>';
    if (list.length) {

        (list.length > 8 ? '<p class="muted">and ' + (list.length - 8) + ' more on the Stock page.</p>' : '') + '<button class="small" data-go="stock">See all stock</button></div>';
    } else h += '<div class="alert ok">Everything is stocked above its low level.</div>';
    h += '<h2>Latest entries</h2>' + activityTable(P.activity(data, 5), false);
    return h;
  }

  function activityTable(rows, withUndo) {
    if (!rows.length) return '<p class="muted">Nothing logged yet.</p>';
    return '<div class="card" style="padding:4px 8px;overflow-x:auto"><table><thead><tr><th>Date</th><th>What</th><th class="n">Amount</th><th>Who</th>' + (withUndo ? '<th></th>' : '') + '</tr></thead><tbody>' + rows.map(function (r) {
      var m = r.move, who = m.type === 'adj' ? 'Count correction' : m.type === 'in' ? (m.donor || '') : (m.household ? m.household + (m.size ? ' (' + m.size + ' people)' : '') : '');
      return '<tr><td>' + niceDate(m.date) + '</td><td>' + (m.type === 'in' ? '<b style="color:var(--accent)">In</b> ' : m.type === 'adj' ? '<b style="color:var(--warn)">Fixed</b> ' : '<b style="color:#6fa3ff">Out</b> ') + esc(r.item.name) + '</td><td class="n">' + qty(m.qty) + ' ' + (r.item.unit === 'lb' ? 'lb' : '') + '</td><td>' + esc(who) + '</td>' +
        (withUndo ? '<td><button class="small danger" data-del="' + esc(m.id) + '" aria-label="Delete this entry">Delete</button></td>' : '') + '</tr>';
    }).join('') + '</tbody></table></div>';
  }

  function logView() {
    var f = form, isIn = f.type === 'in', h = '<h2>' + (isIn ? 'Log a donation' : 'Log a distribution') + '</h2>';
    if (f.saved.length) h += '<div class="alert ok" role="status">Saved: ' + f.saved.map(esc).join(', ') + '</div>';
    h += '<div class="card">';
    if (!isIn) {
      h += '<label for="f-household">Household ID or initials</label><input id="f-household" list="hh" value="' + esc(f.household) + '" placeholder="e.g. H-014 or JS" autocomplete="off" autocapitalize="characters"><datalist id="hh">' + P.knownHouseholds(data).map(function (x) { return '<option value="' + esc(x) + '">'; }).join('') + '</datalist>';
      h += '<p class="muted" style="margin:4px 0 0">Please do not type full names. An ID or initials is enough.</p>';
      h += '<label for="f-size">People in the household</label><input id="f-size" inputmode="numeric" value="' + esc(f.size) + '" placeholder="e.g. 4">';
    }
    h += '<label for="f-item">Item</label>';
    var sl = P.stockList(data).slice().sort(function (a, b) { return a.item.category.localeCompare(b.item.category) || a.item.name.localeCompare(b.item.name); });
    var cats = {}; sl.forEach(function (r) { (cats[r.item.category] = cats[r.item.category] || []).push(r); });
    h += '<select id="f-item"><option value="">Choose an item…</option>' + Object.keys(cats).map(function (c) {
      return '<optgroup label="' + esc(c) + '">' + cats[c].map(function (r) { return '<option value="' + esc(r.item.id) + '"' + (f.itemId === r.item.id ? ' selected' : '') + '>' + esc(r.item.name) + ' (' + stockText(r) + ' on shelf)</option>'; }).join('') + '</optgroup>';
    }).join('') + '</select>';
    h += '<p><button class="small" data-act="toggleNew">' + (f.newItem ? 'Cancel new item' : 'Not on the list? Add a new item') + '</button></p>';
    if (f.newItem) {
      var n = f.ni;
      h += '<div class="card"><label for="n-name">New item name</label><input id="n-name" value="' + esc(n.name) + '">' +
        '<div class="row2"><div><label for="n-cat">Group</label><select id="n-cat">' + P.CATEGORIES.map(function (c) { return '<option' + (n.category === c ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select></div>' +
        '<div><label for="n-unit">Counted in</label><select id="n-unit"><option value="each"' + (n.unit === 'each' ? ' selected' : '') + '>Items (cans, boxes, packs)</option><option value="lb"' + (n.unit === 'lb' ? ' selected' : '') + '>Pounds (loose or bulk)</option></select></div></div>' +
        '<div class="row2">' + (n.unit === 'each' ? '<div><label for="n-lb">Pounds in one item</label><input id="n-lb" inputmode="decimal" value="' + esc(n.lbPer) + '"></div>' : '') +
        '<div><label for="n-low">Flag as low at or below</label><input id="n-low" inputmode="decimal" value="' + esc(n.low) + '" placeholder="e.g. 12"></div></div></div>';
    }
    h += '<div class="row2"><div><label for="f-qty">' + (isIn ? 'How many (or pounds)' : 'How many (or pounds) given') + '</label><input id="f-qty" inputmode="decimal" value="' + esc(f.qty) + '"></div>' +
      '<div><label for="f-date">Date</label><input id="f-date" value="' + esc(f.date) + '" placeholder="Today (or type 10/9/2026)"></div></div>';
    if (isIn) h += '<label for="f-donor">Donor, if known (optional)</label><input id="f-donor" list="dn" value="' + esc(f.donor) + '"><datalist id="dn">' + P.knownDonors(data).map(function (x) { return '<option value="' + esc(x) + '">'; }).join('') + '</datalist>';
    h += '<label for="f-note">Note (optional)</label><input id="f-note" value="' + esc(f.note) + '">';
    if (f.err) h += '<div class="err" role="alert">' + esc(f.err) + '</div>';
    h += '<div class="actions"><button class="primary" data-act="saveLog">Save</button>' + '<button data-act="saveMore">Save and add another' + (isIn ? '' : ' item for this household') + '</button><button data-go="home">Cancel</button></div></div>';
    return h;
  }

  function stockView() {
    var rows = P.stockList(data), q = filter.toLowerCase(), rank = { out: 0, low: 1, ok: 2 };
    rows = rows.filter(function (r) { return (stockFilter === 'all' || r.status !== 'ok') && (!q || (r.item.name + ' ' + r.item.category).toLowerCase().indexOf(q) >= 0); });
    var keyOf = { item: function (r) { return r.item.name.toLowerCase(); }, stock: function (r) { return r.stock; }, low: function (r) { return r.item.low; }, status: function (r) { return rank[r.status]; } }[sortKey];
    rows.sort(function (a, b) { var x = keyOf(a), y = keyOf(b); return (x < y ? -1 : x > y ? 1 : a.item.name.localeCompare(b.item.name)) * (x === y ? 1 : sortDir); });
    function th(key, label, cls) {
      var on = sortKey === key;
      return '<th class="' + cls + '" aria-sort="' + (on ? (sortDir > 0 ? 'ascending' : 'descending') : 'none') + '"><button class="small sortbtn" data-sort="' + key + '" aria-label="Sort by ' + label + '">' + label + (on ? (sortDir > 0 ? ' ▲' : ' ▼') : ' ↕') + '</button></th>';

      '<input class="search" id="search" type="search" placeholder="Search stock" aria-label="Search stock" value="' + esc(filter) + '">';
    h += '<div class="card" style="padding:4px 8px;overflow-x:auto"><table><thead><tr>' + th('item', 'Item', '') + th('stock', 'On shelf', 'n') + th('low', 'Low at', 'n') + th('status', 'Status', '') + '<th><span class="sr">Change</span></th></tr></thead><tbody>' +
      (rows.map(function (r) { return '<tr><td>' + esc(r.item.name) + '<br><span class="muted" style="font-size:.85rem">' + esc(r.item.category) + '</span></td><td class="n">' + stockText(r) + '</td><td class="n">' + (r.item.low || '–') + '</td><td>' + statusPill(r.status) + '</td><td class="noprint"><button class="small" data-edit="' + esc(r.item.id) + '" aria-label="Fix count or change low level for ' + esc(r.item.name) + '">Fix / edit</button></td></tr>'; }).join('') || '<tr><td colspan="5" class="muted">Nothing to show.</td></tr>') + '</tbody></table></div>';
    h += '<div class="actions noprint"><button data-act="printPage">Print this list</button><button data-act="stockCsv">Download for spreadsheet</button></div>';
    return h;
  }

  function activityView() {
    return '<h2>All entries</h2><p class="muted">Made a mistake? Delete the entry, then log it again. You get a few seconds to undo a delete.</p>' + activityTable(P.activity(data, 200), true) +
      '<div class="actions noprint"><button data-act="activityCsv">Download for spreadsheet</button></div>';
  }

  function editView() {
    var item = P.findItem(data, editId), e = editForm;
    if (!item) { view = 'stock'; return stockView(); }
    var unit = item.unit === 'lb' ? 'pounds' : 'items';
    var h = '<h2>Fix or edit: ' + esc(item.name) + '</h2><div class="card">' +
      '<h3 style="margin-top:0">Is the count wrong?</h3><p class="muted">Count what is really on the shelf and type it here. We keep a note of the correction. It does not count as a donation or as food given out.</p>' +
      '<label for="e-count">On the shelf now (' + unit + ')</label><input id="e-count" inputmode="decimal" value="' + esc(e.count) + '">' +
      '<h3>How many counts as low?</h3><label for="e-low">Flag as low at or below (' + unit + '; 0 means never flag)</label><input id="e-low" inputmode="decimal" value="' + esc(e.low) + '">' +
      '<details' + (e.more ? ' open' : '') + '><summary style="min-height:44px;padding:10px 0;cursor:pointer">More options (name, group, weight)</summary>' +
      '<label for="e-name">Name</label><input id="e-name" value="' + esc(e.name) + '"><label for="e-cat">Group</label><select id="e-cat">' + P.CATEGORIES.map(function (c) { return '<option' + (e.category === c ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select>' +
      (item.unit === 'lb' ? '' : '<label for="e-lb">Pounds in one item</label><input id="e-lb" inputmode="decimal" value="' + esc(e.lbPer) + '">') + '</details>';
    if (e.err) h += '<div class="err" role="alert">' + esc(e.err) + '</div>';
    return h + '<div class="actions"><button class="primary" data-act="saveEdit">Save</button><button data-go="stock">Cancel</button></div></div>';
  }

  function moreView() {
    return '<h2>Back up and share</h2><div class="card"><p>Save a copy of everything to a file. Keep a copy somewhere other than this tablet.</p><div class="actions"><button class="primary" data-act="backup">Back up now</button><button data-act="restoreBtn">Restore from a backup file</button></div><input type="file" id="restoreFile" accept=".json,application/json" class="sr" tabindex="-1" aria-label="Choose backup file"></div>' +
      '<h2>Spreadsheets</h2><div class="card"><div class="actions"><button data-act="stockCsv">Stock list</button><button data-act="activityCsv">All donations and distributions</button></div></div>' +
      '<h2>Settings</h2><div class="card"><label for="org">Pantry name</label><input id="org" value="' + esc(settings.org || '') + '"></div>' +
      '<h2>More options</h2><div class="card"><div class="actions" style="margin-top:0"><button data-act="sample">Start over with practice data</button><button class="danger" data-act="empty">Start with an empty pantry</button></div><p class="muted">Both ask you to confirm first, and neither can be undone, so back up first if you have real entries.</p></div>' +
      '<p class="muted">Saved in this browser on this device. Free to use and share (MIT license).</p>';
  }

  function render() {
    applyTheme();
    var h = header() + ({ home: homeView, log: logView, stock: stockView, activity: activityView, more: moreView, edit: editView }[view])();
    if (toast) h += '<div class="toast" role="status"><span>' + esc(toast.text) + '</span>' + (toast.undo ? '<button data-act="undo">Undo</button>' : '') + '</div>';
    var focusId = document.activeElement && document.activeElement.id, pos = document.activeElement && document.activeElement.selectionStart;
    $app.innerHTML = h + nav();
    if (focusId === 'search') { var s = document.getElementById('search'); s.focus(); try { s.setSelectionRange(pos, pos); } catch (e) {} }
  }

  function readForm() {
    if (!form) return;
    var g = function (id) { var e = document.getElementById(id); return e ? e.value : null; };
    var v;
    if ((v = g('f-household')) !== null) form.household = v;
    if ((v = g('f-size')) !== null) form.size = v;
    if ((v = g('f-item')) !== null) form.itemId = v;
    if ((v = g('f-qty')) !== null) form.qty = v;
    if ((v = g('f-date')) !== null) form.date = v;
    if ((v = g('f-donor')) !== null) form.donor = v;
    if ((v = g('f-note')) !== null) form.note = v;
    if (form.newItem) { form.ni.name = g('n-name') || ''; form.ni.category = g('n-cat') || 'Other'; form.ni.unit = g('n-unit') || 'each'; form.ni.low = g('n-low') || ''; if (g('n-lb') !== null) form.ni.lbPer = g('n-lb'); }
  }

  function doSave(again) {
    readForm(); var f = form; f.err = '';
    if (f.type === 'out' && !P.cleanHousehold(f.household)) { f.err = 'Please enter the household ID or initials.'; return render(); }
    if (f.newItem) {
      var r0 = P.addItem(data, f.ni); if (r0.error) { f.err = r0.error; return render(); }
      f.itemId = r0.item.id; f.newItem = false;
    }
    var r = P.addMove(data, f);
    if (r.error) { f.err = r.error; return render(); }
    save();
    var item = P.findItem(data, r.move.itemId), line = qty(r.move.qty) + (item.unit === 'lb' ? ' lb ' : ' × ') + item.name;
    var id = r.move.id;
    if (again) {
      f.saved.push(line); f.itemId = ''; f.qty = ''; f.note = '';
      if (r.warning) f.err = r.warning;
      render(); var e = document.getElementById('f-item'); if (e) e.focus(); return;
    }
    var all = f.saved.concat([line]);
    form = null; view = 'home'; msg = r.warning || '';
    showToast('Saved: ' + all.join(', '), function () { P.removeMove(data, id); save(); });
    render();
  }

  $app.addEventListener('click', function (e) {
    var t = e.target.closest('[data-go],[data-act],[data-log],[data-sf],[data-del],[data-sort],[data-edit]'); if (!t) return;
    if (t.dataset.go) { form = null; return go(t.dataset.go); }
    if (t.dataset.log) { form = newForm(t.dataset.log); view = 'log'; msg = ''; window.scrollTo(0, 0); render(); var el = document.getElementById(form.type === 'out' ? 'f-household' : 'f-item'); if (el) el.focus(); return; }
    if (t.dataset.edit) {
      var it = P.findItem(data, t.dataset.edit); editId = it.id;
      editForm = { count: qty(P.stockOf(data, it.id)), low: String(it.low), name: it.name, category: it.category, lbPer: String(it.lbPer), err: '', more: false };
      return go('edit');
    }
    if (t.dataset.sort) { if (sortKey === t.dataset.sort) sortDir = -sortDir; else { sortKey = t.dataset.sort; sortDir = 1; } return render(); }
    if (t.dataset.sf) { stockFilter = t.dataset.sf; return render(); }
    if (t.dataset.del) {
      var m = P.removeMove(data, t.dataset.del); save(); showToast('Entry deleted.', function () { P.restoreMove(data, m); save(); }); return render();
    }
    var a = t.dataset.act;
    if (a === 'theme') { settings.theme = settings.theme === 'light' ? 'dark' : 'light'; S.saveSettings(settings); readForm(); return render(); }
    if (a === 'welcomed') { settings.welcomed = true; S.saveSettings(settings); return render(); }
    if (a === 'saveEdit') {
      var g = function (id) { var el = document.getElementById(id); return el ? el.value : ''; };
      editForm.count = g('e-count'); editForm.low = g('e-low'); editForm.name = g('e-name'); editForm.category = g('e-cat'); if (document.getElementById('e-lb')) editForm.lbPer = g('e-lb');
      editForm.more = !!document.querySelector('details[open]');
      var u1 = P.updateItem(data, editId, editForm); if (u1.error) { editForm.err = u1.error; return render(); }
      var u2 = P.adjustStock(data, editId, editForm.count); if (u2.error) { editForm.err = u2.error; return render(); }
      save(); var mv = u2.move, nm = editForm.name;
      msg = ''; view = 'stock'; showToast(mv ? nm + ' saved. Count corrected.' : nm + ' saved.', mv ? function () { P.removeMove(data, mv.id); save(); } : null); return render();
    }
    if (a === 'saveLog') return doSave(false);
    if (a === 'saveMore') return doSave(true);
    if (a === 'toggleNew') { readForm(); form.newItem = !form.newItem; return render(); }
    if (a === 'undo') { var u = toast && toast.undo; toast = null; if (u) u(); return render(); }
    if (a === 'printPage') return window.print();
    if (a === 'stockCsv') return download('pantry-stock-' + P.today() + '.csv', '﻿' + P.stockCsv(data), 'text/csv');
    if (a === 'activityCsv') return download('pantry-entries-' + P.today() + '.csv', '﻿' + P.activityCsv(data), 'text/csv');
    if (a === 'backup') { download('pantry-backup-' + P.today() + '.json', JSON.stringify({ app: 'pantry-tracker', org: settings.org || '', savedAt: new Date().toISOString(), data: data }, null, 1), 'application/json'); settings.lastBackup = P.today(); S.saveSettings(settings); msg = 'Backup file saved to your Downloads. Put a copy in your shared folder or on a USB stick.'; return render(); }
    if (a === 'restoreBtn') return document.getElementById('restoreFile').click();
    if (a === 'sample') { if (confirm('Replace everything with made-up practice data?')) { data = SAMPLE.make(); settings.org = SAMPLE.org; save(); S.saveSettings(settings); msg = 'Practice data loaded.'; go('home'); } return; }
    if (a === 'empty') { if (confirm('Delete ALL entries and items and start with an empty pantry? This cannot be undone.')) { data = P.empty(); save(); msg = 'Empty pantry ready. Use "Log donation" and "Not on the list? Add a new item" to begin.'; go('home'); } return; }
  });
  $app.addEventListener('change', function (e) {
    if (e.target.id === 'restoreFile') {
      var file = e.target.files[0]; if (!file) return; var rd = new FileReader();
      rd.onload = function () {
        try {
          var j = JSON.parse(rd.result), d = P.sanitize(j.data || j);
          if (!d.items.length) throw new Error('empty');
          if (!confirm('Replace what is on this tablet with the backup (' + d.items.length + ' items, ' + d.moves.length + ' entries)?')) return;
          data = d; if (j.org) settings.org = j.org; save(); S.saveSettings(settings); msg = 'Backup restored.'; go('home');
        } catch (err) { msg = 'That file does not look like a pantry backup. Choose a file named pantry-backup-….json.'; render(); }
      };
      rd.readAsText(file); return;
    }
    if (e.target.id === 'org') { settings.org = e.target.value.trim(); S.saveSettings(settings); return; }
    if (view !== 'log' || !form) return;
    var id = e.target.id; readForm();
    if (id === 'f-household' && form.type === 'out') { var s = P.lastSize(data, form.household); if (s && !form.size) { form.size = String(s); document.getElementById('f-size').value = form.size; } }
    if (id === 'n-unit') render();
  });
  $app.addEventListener('input', function (e) { if (e.target.id === 'search') { filter = e.target.value; render(); } });

  render();
