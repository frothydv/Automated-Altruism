<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark"><meta name="theme-color" content="#12161c"><title>Toolkit components gallery</title>
<style>html{background:#12161c}</style>
<style>/* Print layout. Mark anything that should not print with class "noprint" (or "no-print"); anything only for paper with "print-only".
   Screen colors are reset to black on white so printing works from dark mode too. */
.print-only{display:none}
@media print{
  :root,:root.light{--bg:#fff;--card:#fff;--panel:#fff;--panel2:#fff;--field:#fff;--text:#000;--muted:#333;--line:#888}
  html,body{background:#fff!important;color:#000!important;font-size:12pt}
  .noprint,.no-print,nav.tabs,.toast,#toast,.modal,button{display:none!important}
  .print-only{display:block!important}
  .card,.res,tr{break-inside:avoid;box-shadow:none}
  table{border-collapse:collapse}th,td{border:1px solid #000;padding:6px;text-align:left;vertical-align:top}
}
</style><style>:root{--bg:#12161c;--card:#1b222b;--line:#5d6b7a;--text:#f2f5f8;--muted:#b4bfcb;--accent:#4cc38a;--accentText:#08210f;--bad:#ff8a80;--field:#0e1217}
:root.light{--bg:#f6f7f4;--card:#fff;--line:#7d8893;--text:#14181d;--muted:#46505b;--accent:#1f7a45;--accentText:#fff;--bad:#b3261e;--field:#fff}
*{box-sizing:border-box}html{color-scheme:dark}html.light{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--text);font:18px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main,header.top{max-width:900px;margin:0 auto;padding:12px 16px}
header.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font-size:1.5rem;margin:.3em 0}h2{font-size:1.25rem;margin:0 0 .3em}
.muted{color:var(--muted)}.small{font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
button{min-height:48px;padding:8px 16px;font:inherit;font-weight:600;color:var(--text);background:transparent;border:2px solid var(--line);border-radius:10px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accentText);border-color:var(--accent)}
button.small{min-height:44px;font-size:.95rem}
button:focus-visible,input:focus-visible{outline:3px solid #ffd54a;outline-offset:2px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left}
pre{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px;overflow:auto;font-size:.85rem;max-height:200px}
input[type=text]{min-height:48px;font:inherit;color:var(--text);background:var(--field);border:2px solid var(--line);border-radius:10px;padding:6px 10px;width:100%;max-width:340px}
.sr{position:absolute;left:-9999px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:9;max-width:92vw}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;border:1px solid var(--line);font-size:.85rem}
ol.steps{padding-left:22px}ol.steps li{margin:6px 0}
@media print{.card{border:1px solid #000}}
</style></head>
<body><div id="app"></div><noscript>This page needs JavaScript turned on to work.</noscript>
<script>
/* Dark/light theme toggle. Dark is the default; light adds class "light" to <html>.
   The app keeps the choice in its own settings object ({theme: 'dark'|'light'}) and saves it however it likes.
   API: ToolkitTheme.apply(theme)  ToolkitTheme.toggle(settings) -> new theme (also applies it; caller saves settings)
        ToolkitTheme.button(theme) -> html for the button, clicks are handled by the app on [data-act=theme] */
(function (root) {
  'use strict';
  function apply(theme) {
    var light = theme === 'light', d = root.document;
    d.documentElement.classList.toggle('light', light);
    var m = d.querySelector('meta[name=color-scheme]'); if (m) m.setAttribute('content', light ? 'light' : 'dark');
    var tc = d.querySelector('meta[name=theme-color]'); if (tc) tc.setAttribute('content', light ? '#f6f7f4' : '#12161c');
  }
  function toggle(settings) { settings.theme = settings.theme === 'light' ? 'dark' : 'light'; apply(settings.theme); return settings.theme; }
  function button(theme) {
    return '<button class="small" type="button" data-act="theme" aria-label="Switch between dark and light colors">' + (theme === 'light' ? '🌙 Dark' : '☀️ Light') + '</button>';
  }
  var api = { apply: apply, toggle: toggle, button: button };
  root.ToolkitTheme = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script><script>
/* Saves text as a file in the browser's Downloads folder (no server). ToolkitDownload.save(filename, text, mimeType). */
(function (root) {
  'use strict';
  function save(name, text, type) {
    var d = root.document, a = d.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: type || 'text/plain' })); a.download = name; d.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  root.ToolkitDownload = { save: save };
  if (typeof module !== 'undefined' && module.exports) module.exports = root.ToolkitDownload;
})(typeof window !== 'undefined' ? window : globalThis);

</script><script>
/* CSV export for spreadsheets. Works in the browser and in Node (core logic can require it).
   cell(v)  - one safe cell: quotes when needed, and defuses leading = + - @ so spreadsheets never run it as a formula
   fromRows(rows) - array of arrays -> CSV text with Windows line breaks
   download(filename, rows) - saves the file with a byte-order mark so Excel shows accents correctly (needs file-download) */
(function (root) {
  'use strict';
  function cell(v) { v = String(v == null ? '' : v); if (/^[=+\-@]/.test(v)) v = "'" + v; return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  function fromRows(rows) { return rows.map(function (r) { return r.map(cell).join(','); }).join('\r\n'); }
  function download(name, rows) { root.ToolkitDownload.save(name, '﻿' + fromRows(rows), 'text/csv'); }
  var api = { cell: cell, fromRows: fromRows, download: download };
  root.ToolkitCsv = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script><script>
/* One-click backup and restore as a small .json file (needs file-download).
   save({app, filename, data, settings}) - downloads {app, savedAt, settings, data}
   read(file, cb) - cb(null, {data, settings, app}) or cb(error). Also accepts older backups (bare data, or {data, org}).
   The app then validates `data` with its own sanitize(), asks "Replace what you have?" and offers undo.
   fileInput(id) - html for the hidden file chooser; pick(id) opens it. */
(function (root) {
  'use strict';
  function save(o) {
    root.ToolkitDownload.save(o.filename, JSON.stringify({ app: o.app || '', savedAt: new Date().toISOString(), settings: o.settings || {}, data: o.data }, null, 1), 'application/json');
  }
  function parse(text) {
    var j = JSON.parse(text); if (!j || typeof j !== 'object') throw new Error('not a backup');
    var settings = j.settings && typeof j.settings === 'object' ? j.settings : (j.org ? { org: j.org } : {});
    return { data: j.data || j, settings: settings, app: j.app || '' };
  }
  function read(file, cb) {
    var fr = new FileReader();
    fr.onload = function () { var r; try { r = parse(fr.result); } catch (e) { return cb(e); } cb(null, r); };
    fr.onerror = function () { cb(new Error('could not read file')); };
    fr.readAsText(file);
  }
  function fileInput(id) { return '<input id="' + id + '" type="file" accept=".json,application/json" class="sr" tabindex="-1" aria-label="Choose backup file">'; }
  function pick(id) { root.document.getElementById(id).click(); }
  var api = { save: save, parse: parse, read: read, fileInput: fileInput, pick: pick };
  root.ToolkitBackup = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script><script>
/* ToolkitPrint.print(title) opens the browser print window; the title becomes the suggested file name when saving as PDF. */
(function (root) {
  'use strict';
  function print(title) {
    var d = root.document, old = d.title; if (title) d.title = title;
    try { root.print(); } finally { d.title = old; }
  }
  root.ToolkitPrint = { print: print };
  if (typeof module !== 'undefined' && module.exports) module.exports = root.ToolkitPrint;
})(typeof window !== 'undefined' ? window : globalThis);

</script><script>
/* Guided first-run welcome: a short "do these 2-3 things first" panel.
   ToolkitWelcome.html({title, intro, steps:[...], doneLabel, doneAct, card:true}) -> html string.
   steps/intro are trusted html written by the app author (use <b> for the thing to tap). The done button carries data-act=doneAct
   (default "welcomeOff"); the app hides the welcome, remembers that in its settings, and offers "Show the welcome again" somewhere under More. */
(function (root) {
  'use strict';
  function html(o) {
    var inner = '<h2' + (o.card === false ? '' : ' style="margin-top:0"') + '>' + (o.title || 'Welcome!') + '</h2>' + (o.intro ? '<p>' + o.intro + '</p>' : '') +
      '<ol class="steps">' + (o.steps || []).map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ol>' +
      '<button class="primary" type="button" data-act="' + (o.doneAct || 'welcomeOff') + '">' + (o.doneLabel || 'Got it, let’s start') + '</button>';
    return o.card === false ? inner : '<div class="card" role="region" aria-label="Welcome">' + inner + '</div>';
  }
  root.ToolkitWelcome = { html: html };
  if (typeof module !== 'undefined' && module.exports) module.exports = root.ToolkitWelcome;
})(typeof window !== 'undefined' ? window : globalThis);

</script><script>
/* Components gallery: each shared component working with made-up sample data. */
(function () {
  'use strict';
  var KEY = 'toolkitGallery.v1', mem = {};
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return JSON.parse(mem.v || '{}'); } }
  function put() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { mem.v = JSON.stringify(st); } }
  var st = load(), toastTimer = null;
  var SAMPLE = [
    { name: 'Alex Rivera', shift: 'Food sorting', day: 'Sat 9:00-12:00', contact: '555-0101' },
    { name: 'Jordan Lee', shift: 'Front desk', day: 'Sat 9:00-12:00', contact: 'jordan@example.test' },
    { name: 'Sam Patel', shift: 'Deliveries', day: 'Sun 13:00-16:00', contact: '555-0103' },
    { name: '=Test, "quoted" name', shift: 'Setup', day: 'Sun 10:00-11:00', contact: '' }
  ];
  if (!st.people) st.people = JSON.parse(JSON.stringify(SAMPLE));
  if (st.welcome === undefined) st.welcome = true;
  ToolkitTheme.apply(st.theme);
  var csvText = '';

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function rows() { return [['Name', 'Shift', 'When', 'Phone or email']].concat(st.people.map(function (p) { return [p.name, p.shift, p.day, p.contact]; })); }
  function toast(msg) { var o = document.getElementById('toast'); if (o) o.remove(); clearTimeout(toastTimer); var t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t); toastTimer = setTimeout(function () { t.remove(); }, 6000); }

  function render() {
    var table = '<table><thead><tr><th>Name</th><th>Shift</th><th>When</th></tr></thead><tbody>' + st.people.map(function (p, i) {
      return '<tr><td>' + esc(p.name) + '</td><td>' + esc(p.shift) + '</td><td>' + esc(p.day) + '</td></tr>'; }).join('') + '</tbody></table>';
    document.getElementById('app').innerHTML =
      '<header class="top noprint"><h1>Toolkit components gallery</h1>' + ToolkitTheme.button(st.theme) + '</header><main>' +
      '<p class="muted noprint">Six small pieces shared by the event check-in, pantry tracker and volunteer shifts tools. Everything below is live and uses made-up people. Nothing leaves this page.</p>' +
      (st.welcome ? ToolkitWelcome.html({ title: 'Welcome! Try these three things', steps: ['Tap <b>Light</b> at the top to switch the colors, and watch them stay that way next time.', 'Under <b>Spreadsheet export</b>, tap <b>Download for spreadsheet</b>.', 'Under <b>Backup and restore</b>, save a backup, change the list, then restore the backup.'], doneLabel: 'Got it' }) : '<div class="noprint"><button class="small" data-act="welcomeOn">Show the welcome again</button></div>') +
      '<div class="card"><h2>1. Theme toggle</h2><p>Dark by default, light for bright rooms. The choice is remembered. Use the button at the top of the page.</p><p class="muted small">Now: <span class="pill">' + (st.theme === 'light' ? 'Light' : 'Dark') + '</span></p></div>' +
      '<div class="card"><h2>Sample volunteer list</h2><div id="list">' + table + '</div><p class="muted small noprint">The next three sections all work on this list.</p></div>' +
      '<div class="card noprint"><h2>2. Spreadsheet export (CSV)</h2><p>Opens in Excel, Google Sheets or Numbers. Names that start with = + - or @ are made safe so a spreadsheet never runs them as a formula (see the last row).</p>' +
      '<div class="actions"><button class="primary" data-act="csv">Download for spreadsheet</button><button data-act="csvPeek">Show what is in the file</button></div>' + (csvText ? '<pre tabindex="0" aria-label="File contents">' + esc(csvText) + '</pre>' : '') + '</div>' +
      '<div class="card noprint"><h2>3. Backup and restore</h2><p>One file with everything. Try it: save a backup, remove a person, then restore the backup.</p>' +
      '<div class="actions"><button class="primary" data-act="backup">Save a backup file</button><button data-act="restore">Restore from a backup</button><button data-act="removeOne">Remove the first person</button><button data-act="reset">Reset the sample list</button></div>' + ToolkitBackup.fileInput('file') + '<p class="muted small">' + st.people.length + ' people in the list.</p></div>' +
      '<div class="card noprint"><h2>4. Print layout</h2><p>Menus, buttons and colors disappear, so only the list prints, in black on white (even from dark mode). Try “Save as PDF” in the print window.</p><div class="actions"><button class="primary" data-act="print">Print the list</button></div></div>' +
      '<div class="card print-only"><p>Printed from the toolkit components gallery. Made-up sample data.</p></div>' +
      '<div class="card noprint"><h2>5. First-run welcome</h2><p>The panel at the top of this page. Tools show it the first time they open, with practice data, and keep a “show again” button under More.</p></div>' +
      '<div class="card noprint"><h2>Open the three tools</h2><p>Each one is a single file in the <b>tools</b> folder next to this page. Double-click it to open. They use the pieces above, with made-up practice data.</p><ul><li><a href="tools/event-checkin.html">Door check-in</a></li><li><a href="tools/pantry-tracker.html">Pantry tracker</a></li><li><a href="tools/volunteer-shifts.html">Volunteer shifts</a></li></ul></div><div class="card noprint"><h2>Who uses what</h2><table><thead><tr><th>Component</th><th>Check-in</th><th>Pantry</th><th>Shifts</th></tr></thead><tbody>' +
      [['theme-toggle', 1, 1, 1], ['backup-restore', 1, 1, 1], ['csv-export', 1, 1, 1], ['print-layout', 1, 1, 1], ['first-run-welcome', 1, 1, 1]].map(function (r) { return '<tr><td>' + r[0] + '</td>' + r.slice(1).map(function (v) { return '<td>' + (v ? '✓' : '–') + '</td>'; }).join('') + '</tr>'; }).join('') +
      '</tbody></table><p class="muted small">file-download is a tiny helper that csv-export and backup-restore share.</p></div></main>';
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    switch (b.dataset.act) {
      case 'theme': st.theme = ToolkitTheme.toggle({ theme: st.theme }); put(); render(); break;
      case 'welcomeOff': st.welcome = false; put(); render(); break;
      case 'welcomeOn': st.welcome = true; put(); render(); break;
      case 'csv': ToolkitCsv.download('sample-volunteers.csv', rows()); toast('Spreadsheet file saved to your Downloads folder.'); break;
      case 'csvPeek': csvText = ToolkitCsv.fromRows(rows()); render(); break;
      case 'backup': ToolkitBackup.save({ app: 'components-gallery', filename: 'gallery-backup.json', data: st.people }); toast('Backup saved to your Downloads folder.'); break;
      case 'restore': ToolkitBackup.pick('file'); break;
      case 'removeOne': if (st.people.length && confirm('Remove ' + st.people[0].name + ' from the sample list?')) { st.people.shift(); put(); csvText = ''; render(); toast('Removed. Restore your backup to get them back.'); } break;
      case 'reset': st.people = JSON.parse(JSON.stringify(SAMPLE)); put(); csvText = ''; render(); toast('Sample list reset.'); break;
      case 'print': ToolkitPrint.print('Sample volunteer list'); break;
    }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id !== 'file' || !e.target.files[0]) return;
    ToolkitBackup.read(e.target.files[0], function (err, bk) {
      if (err || !Array.isArray(bk.data) || !bk.data.every(function (p) { return p && typeof p.name === 'string'; })) return toast('That file is not a backup from this page. Choose the file named gallery-backup.json.');
      if (!confirm('Replace the list with this backup (' + bk.data.length + ' people)?')) return;
      st.people = bk.data; put(); csvText = ''; render(); toast('Backup restored.');
    });
  });
  render();
})();

</script>
</body></html>
