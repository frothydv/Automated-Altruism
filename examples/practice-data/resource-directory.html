<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark"><meta name="theme-color" content="#12161c"><title>Local help list</title>
<style>html{background:#12161c}</style>
<style>/* Print layout. Mark anything that should not print with class "noprint" (or "no-print"); anything only for paper with "print-only".
   Screen colors are reset to black on white so printing works from dark mode too. */
.print-only{display:none}
@media print{
  :root,:root.light{--bg:#fff;--card:#fff;--panel:#fff;--panel2:#fff;--field:#fff;--text:#000;--muted:#333;--line:#888}
  html,body{background:#fff!important;color:#000!important;font-size:12pt}
  .noprint,.no-print,nav.tabs,.toast,#toast,.modal,button{display:none!important}
  .print-only{display:block!important}
  .card,.res,tr{break-inside:avoid;box-shadow:none}
  .print-break{break-before:page}
  .print-page{break-after:page;page-break-after:always}.print-page:last-child{break-after:auto;page-break-after:auto}
  body.printing-section .print-section:not(.print-this){display:none!important}
  table{border-collapse:collapse}th,td{border:1px solid #000;padding:6px;text-align:left;vertical-align:top}
}
</style><style>:root{--bg:#12161c;--card:#1b222b;--line:#4a5663;--text:#f2f5f8;--muted:#b4bfcb;--accent:#5fd18a;--accentText:#08210f;--warn:#ffc857;--bad:#ff8a80;--field:#0e1217;--blue:#2f6fd0}
:root.light{--bg:#f6f7f4;--card:#fff;--line:#7d8893;--text:#14181d;--muted:#46505b;--accent:#1f7a45;--accentText:#fff;--warn:#8a5a00;--bad:#b3261e;--field:#fff;--blue:#1c55b0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:820px;margin:0 auto;padding:10px 14px 96px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
header.top h1{font-size:1.15rem;margin:0;flex:1;min-width:150px}
h2{font-size:1.3rem;margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.muted{color:var(--muted)}.small{font-size:.9rem}
button,.btn{font:inherit;min-height:48px;padding:10px 16px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accentText);border-color:var(--accent);font-weight:700}
button.danger{border-color:var(--bad);color:var(--bad)}
button.small{min-height:40px;padding:6px 12px;font-size:.95rem}
button.link{border:0;background:none;text-decoration:underline;min-height:44px;padding:6px}
nav.tabs{display:flex;gap:6px;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:6px;justify-content:center;z-index:5}
nav.tabs button{flex:1;max-width:200px;min-height:54px}
nav.tabs button[aria-current=page]{background:var(--accent);color:var(--accentText);border-color:var(--accent);font-weight:700}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select{font:inherit;width:100%;min-height:50px;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--field);color:var(--text)}
input.search{font-size:1.4rem;min-height:62px;border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.actions .primary{flex:1;min-height:58px;font-size:1.2rem}
.evbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.evbar b{font-size:1.1rem}
.count{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.count .num{font-size:3rem;font-weight:800;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.res{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--card)}
.res.here{border-color:var(--accent)}
.res .who{flex:1;min-width:150px}.res .who b{font-size:1.2rem}
.res .btns{display:flex;gap:8px;flex-wrap:wrap}
.res .btns .primary{min-height:52px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-weight:700;font-size:.85rem;border:2px solid var(--accent);color:var(--accent)}
.alert{border-left:6px solid var(--warn);padding:10px 14px;background:var(--card);border-radius:10px;margin:12px 0}
.alert.ok{border-left-color:var(--accent)}
.sample{background:var(--warn);color:#201500;padding:6px 12px;border-radius:10px;font-weight:600;font-size:.9rem;margin:6px 0}
:root.light .sample{background:#ffe9b0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:9;display:flex;gap:14px;align-items:center;max-width:92vw}
.toast button{min-height:40px;background:transparent;color:var(--bg);border-color:var(--bg)}
.err{color:var(--bad);font-weight:600;margin-top:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{min-height:44px}
.chips button[aria-pressed=true]{background:var(--accent);color:var(--accentText);border-color:var(--accent)}
.sr{position:absolute;left:-9999px}
.namerow{display:flex;gap:8px;margin:8px 0}.namerow input{flex:1}
ol.steps{padding-left:22px}ol.steps li{margin:6px 0}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:.9rem}
@media(max-width:560px){.row2{grid-template-columns:1fr}.count .num{font-size:2.5rem}}
.tmap{width:100%;height:auto;display:block;border:2px solid var(--line);border-radius:12px;background:#2a3340}
.tmap-bg{fill:#2a3340}:root.light .tmap-bg{fill:#dfe6dc}
.pin{cursor:pointer}.pin:focus-visible circle{stroke:#ffc857;stroke-width:5}
.place{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--card)}
.place.sel{border-color:var(--warn);border-width:3px}
.place h3{margin:0 0 2px;font-size:1.2rem}
.place .line{margin:2px 0}.place a{color:var(--text)}
.place .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pill.warn{border-color:var(--warn);color:var(--warn)}
.num{display:inline-block;min-width:1.7em;text-align:center;border-radius:99px;color:#fff;font-weight:700;padding:0 6px;margin-right:6px}
.days{display:flex;gap:6px;flex-wrap:wrap}.days button{min-width:62px}
.days button[aria-pressed=true]{background:var(--accent);color:var(--accentText);border-color:var(--accent);font-weight:700}
textarea{font:inherit;width:100%;min-height:70px;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--field);color:var(--text)}
details.more{margin:14px 0}details.more summary{cursor:pointer;min-height:44px;padding:8px 0;font-weight:600}
.pick{border:3px solid var(--warn);border-radius:14px;padding:10px;margin:10px 0}
.legend{columns:2 280px;margin:10px 0}.legend button{display:block;width:100%;text-align:left;margin:4px 0}
.print-only{display:none}
@media print{
  @page{margin:.5in}
  #printArea{font-family:Georgia,"Times New Roman",serif;color:#000}
  #printArea h1{font-size:20pt;margin:0}
  #printArea .pl-sub{margin:2px 0 8px;font-size:10pt;border-bottom:2px solid #000;padding-bottom:4px}
  .pl-cols{column-count:2;column-gap:.35in;font-size:9.5pt;line-height:1.25}
  .small-print .pl-cols{font-size:8.5pt}.tiny-print .pl-cols{font-size:7.5pt}
  .pl-cols h2{font-size:11.5pt;margin:8px 0 3px;border-bottom:1px solid #000;break-after:avoid}
  .pl-item{break-inside:avoid;margin:0 0 5px}.pl-item b{font-size:1.05em}.pl-item i{color:#333}
  .pl-foot{margin-top:8px;font-size:9pt;border-top:1px solid #000;padding-top:4px}
  .pl-page .pl-kind{font-size:12pt;line-height:1.35}.small-print .pl-page .pl-kind{font-size:10.5pt}.tiny-print .pl-page .pl-kind{font-size:9pt}
  .pl-page .pl-kind h2{font-size:15pt;margin:14px 0 6px;border-bottom:2px solid #000}
  .pl-page .pl-item{margin:0 0 10px}
}
@media(max-width:560px){.row2{grid-template-columns:1fr}}

  }
  function printArea() {
    var groups = D.group(data, data.places), latest = data.places.map(function (p) { return p.checked; }).sort().pop() || today();
    if (settings.printPerKind) return '<div class="print-only print-section ' + esc(settings.printSize || '') + '" id="printArea">' + printPages(groups, latest) + '</div>';
    return '<div class="print-only print-section ' + esc(settings.printSize || '') + '" id="printArea"><h1>' + esc(settings.org || 'Local help') + ': Local help</h1><div class="pl-sub">Free help nearby, grouped by kind. Printed ' + esc(fmt(today())) + '. Most recent check: ' + esc(fmt(latest)) + '.</div><div class="pl-cols">' +
      groups.map(function (g) { return '<section><h2>' + esc(g.cat.label) + '</h2>' + g.places.map(printItem).join('') + '</section>'; }).join('') +
      '</div>' + (settings.deskNote ? '<div class="pl-foot">' + esc(settings.deskNote) + '</div>' : '') + '</div>';
  }
  function doPrint() { var el = document.getElementById('printArea'); if (!el) { var d = document.createElement('div'); d.innerHTML = printArea(); document.body.appendChild(d.firstChild); } ToolkitPrint.print((settings.org || 'Local help') + ' - local help list'); }

  /* ---- render ---- */
  function render() {
    var body = screen === 'list' ? listScreen() : screen === 'map' ? mapScreen() : screen === 'edit' ? editScreen() : screen === 'pick' ? pickScreen() : moreScreen();
    $app.innerHTML = header() + '<div class="noprint">' + body.replace(/<div class="print-only[\s\S]*$/, '') + '</div>' + (screen === 'list' ? body.match(/<div class="print-only[\s\S]*$/)[0] : '') + (screen === 'edit' || screen === 'pick' ? '' : tabs());
    if (screen === 'list') paintList(); else if (screen === 'map') paintMap();
    netStatus();
  }
  function netStatus() { var n = document.getElementById('net'); if (n) n.textContent = navigator.onLine === false ? '● Offline: map shows pins only' : ''; }
  window.addEventListener('online', function () { netStatus(); if (screen === 'map') paintMap(); });
  window.addEventListener('offline', function () { netStatus(); if (screen === 'map') paintMap(); });

  /* ---- events ---- */
  $app.addEventListener('input', function (e) {
    if (e.target.id === 'q') { query = e.target.value; if (screen === 'list') paintList(); else if (screen === 'map') paintMap(); }
  });
  $app.addEventListener('change', function (e) {
    var k = e.target.getAttribute('data-set'); if (e.target.id === 'restoreFile') { return restoreFile(e.target); }
    if (!k) return; settings[k] = e.target.type === 'checkbox' ? e.target.checked : (k === 'staleDays' ? +e.target.value : e.target.value); save();
  });
  $app.addEventListener('keydown', function (e) {
    var g = e.target.closest && e.target.closest('.pin');
    if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); selId = g.getAttribute('data-id'); paintMap(); }
  });
  function restoreFile(input) {
    var f = input.files && input.files[0]; if (!f) return; var err = document.getElementById('moreerr');
    ToolkitBackup.read(f, function (e, r) {
      input.value = '';
      if (e) { err.textContent = 'That file does not look like a backup from this list. Pick a file ending in .json that you saved earlier.'; return; }
      var nd = D.sanitize(r.data);
      if (!window.confirm('Replace the current list (' + data.places.length + ' places) with the backup (' + nd.places.length + ' places)? You can undo this right after.')) return;
      var snap = snapshot(); data = nd; if (r.settings && r.settings.org) settings.org = r.settings.org; if (r.settings && r.settings.deskNote != null) settings.deskNote = r.settings.deskNote; settings.sample = false; save(); render(); toast('Backup restored: ' + nd.places.length + ' places.', snap);
    });
  }
  $app.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-act],.pin,svg.tmap') : null; if (!t) return;
    var act = t.getAttribute('data-act'), id = t.getAttribute('data-id');
    if (!act && screen !== 'pick' && t.classList.contains('pin')) { selId = t.getAttribute('data-id'); if (screen === 'map') paintMap(); return; }
    if (!act && screen === 'pick') { var ll = M.fromEvent(t, e, mapView(pickPins())); if (ll) { form.lat = ll.lat; form.lon = ll.lon; form.pinnedByHand = true; settings.center = settings.center || [ll.lat, ll.lon]; screen = 'edit'; render(); setMsg('Location set ✓'); } return; }
    if (!act) return;
    if (act === 'tab') return go(t.getAttribute('data-v'));
    if (act === 'theme') { ToolkitTheme.toggle(settings); save(); return render(); }
    if (act === 'welcomeOff') { settings.welcome = false; save(); return render(); }
    if (act === 'welcomeOn') { settings.welcome = true; save(); return go('list'); }
    if (act === 'clear') { query = ''; render(); var q = document.getElementById('q'); if (q) q.focus(); return; }
    if (act === 'print') return doPrint();
    if (act === 'add') return openForm(null);
    if (act === 'edit') return openForm(place(id));
    if (act === 'select') { selId = id; return paintMap(); }
    if (act === 'checked') { var p = place(id), snap = snapshot(); p.checked = today(); save(); render(); return toast('Marked “' + p.name + '” as checked today.', snap); }
    if (act === 'day') { var d = +t.getAttribute('data-v'), i = form.days.indexOf(d); if (i >= 0) form.days.splice(i, 1); else form.days.push(d); form.days.sort(function (a, b) { return a - b; }); t.setAttribute('aria-pressed', i < 0); return; }
    if (act === 'daysSet') { readForm(); var v = t.getAttribute('data-v'); form.days = v ? v.split(',').map(Number) : []; return render(); }
    if (act === 'formCancel') return go('list');
    if (act === 'formSave') return formSave();
    if (act === 'formDelete') { var pp = place(form.id); if (!window.confirm('Delete “' + pp.name + '” from the list?')) return; var sn = snapshot(); data.places = data.places.filter(function (x) { return x.id !== pp.id; }); save(); form = null; screen = 'list'; render(); return toast('Deleted “' + pp.name + '”.', sn); }
    if (act === 'lookup') { readForm(); if (!form.address.trim()) return setMsg('Type the address first.'); if (navigator.onLine === false) return setMsg('No internet right now. Tap the map to place it instead.'); setMsg('Looking…'); var f0 = form; return geocode(f0.address).then(function (ll) { if (ll) { f0.lat = ll.lat; f0.lon = ll.lon; f0.pinnedByHand = true; setMsg('Found it. Location set ✓'); } else setMsg('I could not find that address (or the lookup failed). Check the spelling, or tap the map to place it.'); }); }
    if (act === 'pickStart') { readForm(); screen = 'pick'; render(); return window.scrollTo(0, 0); }
    if (act === 'pickCancel') { screen = 'edit'; return render(); }
    if (act === 'locClear') { readForm(); form.lat = null; form.lon = null; return render(); }
    if (act === 'backup') return ToolkitBackup.save({ app: 'resource-directory', filename: 'local-help-backup-' + today() + '.json', data: data, settings: { org: settings.org, deskNote: settings.deskNote } });
    if (act === 'restore') return ToolkitBackup.pick('restoreFile');
    if (act === 'csv') return ToolkitCsv.download('local-help-list-' + today() + '.csv', D.csvRows(data));
    if (act === 'sample') { if (!window.confirm('Replace the list with made-up practice places? You can undo this right after.')) return; var s1 = snapshot(); startSample(); save(); go('list'); return toast('Practice data loaded.', s1); }
    if (act === 'fresh') { if (!window.confirm('Remove all ' + data.places.length + ' places and start with an empty list? You can undo this right after.')) return; var fr = PD.startFresh({ data: data, settings: settings }, Object.assign({ empty: function () { return D.sanitize({ places: [] }); } }, PRACTICE)); data = fr.data; save(); go('list'); return toast('Started fresh, practice name and note cleared. Tap “Add a place” to begin.', fr.undo); }
  });
  function pickPins() { return data.places.filter(function (x) { return x.id !== form.id; }).map(function (x) { return { id: x.id, n: '•', lat: x.lat, lon: x.lon }; }).filter(function (x) { return M.valid(x.lat, x.lon); }).concat(M.valid(form.lat, form.lon) ? [{ id: 'me', n: '★', lat: form.lat, lon: form.lon }] : []); }
  render();
})();

</script>
</body></html>
