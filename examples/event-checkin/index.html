<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark"><meta name="theme-color" content="#12161c"><title>Door check-in</title>
<style>html{background:#12161c}</style>
<style>/* Print layout. Mark anything that should not print with class "noprint" (or "no-print"); anything only for paper with "print-only".
   Screen colors are reset to black on white so printing works from dark mode too. */
.print-only{display:none}
@media print{
  :root,:root.light{--bg:#fff;--card:#fff;--panel:#fff;--panel2:#fff;--field:#fff;--text:#000;--muted:#333;--line:#888}
  html,body{background:#fff!important;color:#000!important;font-size:12pt}
  .noprint,.no-print,nav.tabs,.toast,#toast,.modal,button{display:none!important}
  .print-only{display:block!important}
  .card,.res,tr{break-inside:avoid;box-shadow:none}
  .print-break{break-before:page}
  .print-page{break-after:page;page-break-after:always}.print-page:last-child{break-after:auto;page-break-after:auto}
  body.printing-section .print-section:not(.print-this){display:none!important}
  table{border-collapse:collapse}th,td{border:1px solid #000;padding:6px;text-align:left;vertical-align:top}
}
</style><style>:root{--bg:#12161c;--card:#1b222b;--line:#4a5663;--text:#f2f5f8;--muted:#b4bfcb;--accent:#5fd18a;--accentText:#08210f;--warn:#ffc857;--bad:#ff8a80;--field:#0e1217;--blue:#2f6fd0}
:root.light{--bg:#f6f7f4;--card:#fff;--line:#7d8893;--text:#14181d;--muted:#46505b;--accent:#1f7a45;--accentText:#fff;--warn:#8a5a00;--bad:#b3261e;--field:#fff;--blue:#1c55b0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:820px;margin:0 auto;padding:10px 14px 96px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
header.top h1{font-size:1.15rem;margin:0;flex:1;min-width:150px}
h2{font-size:1.3rem;margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.muted{color:var(--muted)}.small{font-size:.9rem}
button,.btn{font:inherit;min-height:48px;padding:10px 16px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accentText);border-color:var(--accent);font-weight:700}
button.danger{border-color:var(--bad);color:var(--bad)}
button.small{min-height:40px;padding:6px 12px;font-size:.95rem}
button.link{border:0;background:none;text-decoration:underline;min-height:44px;padding:6px}
nav.tabs{display:flex;gap:6px;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:6px;justify-content:center;z-index:5}
nav.tabs button{flex:1;max-width:200px;min-height:54px}
nav.tabs button[aria-current=page]{background:var(--accent);color:var(--accentText);border-color:var(--accent);font-weight:700}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select{font:inherit;width:100%;min-height:50px;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--field);color:var(--text)}
input.search{font-size:1.4rem;min-height:62px;border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.actions .primary{flex:1;min-height:58px;font-size:1.2rem}
.evbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.evbar b{font-size:1.1rem}
.count{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.count .num{font-size:3rem;font-weight:800;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.res{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--card)}
.res.here{border-color:var(--accent)}
.res .who{flex:1;min-width:150px}.res .who b{font-size:1.2rem}
.res .btns{display:flex;gap:8px;flex-wrap:wrap}
.res .btns .primary{min-height:52px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-weight:700;font-size:.85rem;border:2px solid var(--accent);color:var(--accent)}
.alert{border-left:6px solid var(--warn);padding:10px 14px;background:var(--card);border-radius:10px;margin:12px 0}
.alert.ok{border-left-color:var(--accent)}
.sample{background:var(--warn);color:#201500;padding:6px 12px;border-radius:10px;font-weight:600;font-size:.9rem;margin:6px 0}
:root.light .sample{background:#ffe9b0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:9;display:flex;gap:14px;align-items:center;max-width:92vw}
.toast button{min-height:40px;background:transparent;color:var(--bg);border-color:var(--bg)}
.err{color:var(--bad);font-weight:600;margin-top:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{min-height:44px}
.chips button[aria-pressed=true]{background:var(--accent);color:var(--accentText);border-color:var(--accent)}
.sr{position:absolute;left:-9999px}
.namerow{display:flex;gap:8px;margin:8px 0}.namerow input{flex:1}
ol.steps{padding-left:22px}ol.steps li{margin:6px 0}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:.9rem}
@media(max-width:560px){.row2{grid-template-columns:1fr}.count .num{font-size:2.5rem}}

<script>
/* Dark/light theme toggle. Dark is the default; light adds class "light" to <html>.
   The app keeps the choice in its own settings object ({theme: 'dark'|'light'}) and saves it however it likes.
   API: ToolkitTheme.apply(theme)  ToolkitTheme.toggle(settings) -> new theme (also applies it; caller saves settings)
        ToolkitTheme.button(theme) -> html for the button, clicks are handled by the app on [data-act=theme] */

    d.documentElement.classList.toggle('light', light);

    var tc = d.querySelector('meta[name=theme-color]'); if (tc) tc.setAttribute('content', light ? '#f6f7f4' : '#12161c');
  }
  function toggle(settings) { settings.theme = settings.theme === 'light' ? 'dark' : 'light'; apply(settings.theme); return settings.theme; }
  function button(theme) {
    return '<button class="small" type="button" data-act="theme" aria-label="Switch between dark and light colors">' + (theme === 'light' ? '🌙 Dark' : '☀️ Light') + '</button>';
  }
  var api = { apply: apply, toggle: toggle, button: button };
  root.ToolkitTheme = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

/* CSV export for spreadsheets. Works in the browser and in Node (core logic can require it).
   cell(v)  - one safe cell: quotes when needed, and defuses leading = + - @ so spreadsheets never run it as a formula

   parse(text) - the reverse: CSV text -> array of arrays. Handles quotes, line breaks inside cells, a byte-order mark, and , ; or tab separators.

    var rows = [], row = [], c = '', q = false, i, ch;
    for (i = 0; i < text.length; i++) {
      ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { c += '"'; i++; } else q = false; } else c += ch; }
      else if (ch === '"' && c === '') q = true;
      else if (ch === best) { row.push(c); c = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(c); c = ''; rows.push(row); row = []; }
      else c += ch;

    return rows.map(function (r) { return r.map(function (v) { return /^'[=+\-@]/.test(v) ? v.slice(1) : v; }); })
      .filter(function (r) { return r.length > 1 || (r.length === 1 && r[0].trim() !== ''); });

</script><script>
/* One-click backup and restore as a small .json file (needs file-download).
   save({app, filename, data, settings}) - downloads {app, savedAt, settings, data}
   read(file, cb) - cb(null, {data, settings, app}) or cb(error). Also accepts older backups (bare data, or {data, org}).
   The app then validates `data` with its own sanitize(), asks "Replace what you have?" and offers undo.
   fileInput(id) - html for the hidden file chooser; pick(id) opens it. */

  }

    var settings = j.settings && typeof j.settings === 'object' ? j.settings : (j.org ? { org: j.org } : {});

    fr.onerror = function () { cb(new Error('could not read file')); };

/* Guided first-run welcome: a short "do these 2-3 things first" panel.
   ToolkitWelcome.html({title, intro, steps:[...], doneLabel, doneAct, card:true}) -> html string.
   steps/intro are trusted html written by the app author (use <b> for the thing to tap). The done button carries data-act=doneAct

      '<ol class="steps">' + (o.steps || []).map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ol>' +
      '<button class="primary" type="button" data-act="' + (o.doneAct || 'welcomeOff') + '">' + (o.doneLabel || 'Got it, let’s start') + '</button>';

/* Practice data helper: remembers which settings a tool filled with made-up values, and clears them on "start fresh".
   Plain script (global ToolkitPracticeData) or require(). No storage of its own: it works on the tool's settings object.
   Settings are cleared only when they still hold the practice value, so a name the charity typed is never touched. */

/* event-checkin core: pure logic, no DOM, no storage. Works in browsers and Node.
   Data: {version, guests:[{id,name,familyId|null,createdAt}], events:[{id,name,date}],

    });

      if (!e || !e.id || eids[e.id]) return; var dt = C.parseDate(e.date); if (!dt) return;
      eids[e.id] = 1; o.events.push({ id: String(e.id), name: String(e.name || 'Event').slice(0, 80), date: dt });
    });

      if (!c || !gids[c.guestId] || !eids[c.eventId]) return;
      var k = c.eventId + '|' + c.guestId; if (seen[k]) return; seen[k] = 1;
      o.checkins.push({ id: String(c.id || C.uid('c')), eventId: c.eventId, guestId: c.guestId, at: +c.at || 0 });
    });

    return '<h2>Settings</h2><div class="card"><label for="org">Name shown at the top</label><input id="org" value="' + esc(settings.org || '') + '" placeholder="Your church or group">' +
      '<p class="muted small">Saved as you type.</p></div>' +
      '<h2>Keep your records safe</h2><div class="card"><div class="actions" style="margin-top:0"><button class="primary" type="button" data-act="backup">Save a backup file</button>' +
      '<button type="button" data-act="restore">Restore from a backup</button></div>' + ToolkitBackup.fileInput('file') + '' +
      '<p class="muted small">Everything is stored on this device only. A backup is a small file you can keep on a USB stick or email to yourself.</p></div>' +
      '<h2>People on your list</h2><div class="card"><p>' + data.guests.length + ' people. To fix a typo or remove someone:</p><label for="pq">Find a person</label><input id="pq" type="search" autocomplete="off" placeholder="Start typing a name"><div id="plist"></div></div>' +
      '<h2>More options</h2><div class="card"><div class="actions" style="margin-top:0"><button type="button" data-act="sampleReset">Start over with practice data</button><button class="danger" type="button" data-act="fresh">Start fresh (erase everything)</button></div>' +
      '<p class="muted small">Both ask you first, and offer a way to undo.</p></div>';
  }
  function paintPeople() {
    var box = document.getElementById('plist'), q = document.getElementById('pq'); if (!box) return;
    var res = C.search(data, q.value, null, 8);
    box.innerHTML = res.map(function (r) {
      return '<div class="res"><div class="who"><b>' + esc(r.guest.name) + '</b></div><div class="btns"><button class="small" type="button" data-act="rename" data-id="' + r.guest.id + '" aria-label="Rename ' + esc(r.guest.name) + '">Rename</button>' +
        '<button class="small danger" type="button" data-act="delGuest" data-id="' + r.guest.id + '" aria-label="Remove ' + esc(r.guest.name) + '">Remove</button></div></div>';
    }).join('');
  }

  function render() {
    var body = screen === 'checkin' ? checkinScreen() : screen === 'here' ? hereScreen() : screen === 'events' ? eventsScreen() : moreScreen();
    $app.innerHTML = header() + '<main>' + body + '</main>' + tabs();
    paintNet(); paintCount(); paintResults(); paintPeople();
    var q = document.getElementById('q'); if (q && !addForm && !settings.welcome) { try { q.focus({ preventScroll: true }); } catch (e) {} }
    if (addForm) { var f = document.querySelector('.nm[data-i="' + (addForm.focus || 0) + '"]'); if (f) f.focus(); }
  }
  function paintNet() { var n = document.getElementById('net'); if (n) n.textContent = (navigator.onLine === false ? 'Offline · ' : '') + 'Saved on this device'; }
  window.addEventListener('online', paintNet); window.addEventListener('offline', paintNet);

  function checkInIds(ids, label) {
    var ev = currentEvent(), snap = snapshot(), added = C.checkInMany(data, ev.id, ids);
    if (!added.length) { toast('Already checked in.'); return; }
    save(); query = ''; var q = document.getElementById('q'); if (q) q.value = '';
    render(); toast(label || (added.length === 1 ? C.guest(data, added[0]).name + ' checked in' : added.length + ' people checked in'), snap);
    var q2 = document.getElementById('q'); if (q2) q2.focus();
  }
  function readNames() { return [].map.call(document.querySelectorAll('.nm'), function (i) { return i.value; }); }

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'q') { query = t.value; paintResults(); }
    else if (t.id === 'pq') paintPeople();
    else if (t.id === 'org') { settings.org = t.value; save(); var h = document.querySelector('header.top h1'); if (h) h.textContent = t.value || 'Door check-in'; }
    else if (t.id === 'evn') settings.draftName = t.value;
    else if (t.classList && t.classList.contains('nm') && addForm) addForm.names = readNames();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return; var t = e.target;
    if (t.id === 'q') {
      var ev = currentEvent(), res = C.search(data, query, ev && ev.id, 20); e.preventDefault();
      var open = res.filter(function (r) { return !r.here; });
      if (res.length && (res.length === 1 || res[0].score > (res[1] ? res[1].score : -1)) && !res[0].here) checkInIds([res[0].guest.id]);
      else if (!res.length && query.trim()) openAdd();
      else if (open.length === 1) checkInIds([open[0].guest.id]);
    } else if (t.classList && t.classList.contains('nm')) { e.preventDefault(); go1(); }
    else if (t.id === 'evn' || t.id === 'evd') { e.preventDefault(); startEvent(); }
  });
  function go1() { var a = document.querySelector('[data-act=addGo]'); if (a) a.click(); }
  function openAdd() { addForm = { names: [C.tidyName(query)], focus: 0 }; render(); }
  function startEvent() {
    var r = C.addEvent(data, document.getElementById('evn').value, document.getElementById('evd').value);
    if (r.error) { document.getElementById('everr').textContent = r.error; return; }
    settings.currentEventId = r.event.id; settings.draftName = ''; save(); go('checkin'); toast(r.existed ? 'That event already existed, so it is open again.' : 'Event started. Ready for check-in.');
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return; var act = b.dataset.act, id = b.dataset.id, ev = currentEvent(), snap;
    switch (act) {
      case 'tab': go(b.dataset.v); break;
      case 'theme': ToolkitTheme.toggle(settings); save(); render(); break;
      case 'printHere': ToolkitPrint.print((ev ? ev.name + ' ' + ev.date : 'Who is here')); break;
      case 'hereCsv':
        ToolkitCsv.download('checkin-' + ev.date + '.csv', [['Event', 'Date', 'Name', 'Checked in at']].concat(C.attendees(data, ev.id).map(function (a) {
          return [ev.name, ev.date, a.guest.name, a.at ? new Date(a.at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : ''];
        }))); toast('Spreadsheet file saved to your Downloads folder.'); break;
      case 'welcomeOff': settings.welcome = false; save(); render(); break;
      case 'in1': checkInIds([id]); break;
      case 'inFam': checkInIds(C.familyMembers(data, C.guest(data, id)).map(function (g) { return g.id; })); break;
      case 'undo1': snap = snapshot(); C.undoCheckIn(data, ev.id, id); save(); render(); toast('Check-in removed.', snap); break;
      case 'addOpen': openAdd(); break;
      case 'addCancel': addForm = null; render(); break;
      case 'moreName': addForm.names = readNames(); var first = (addForm.names[0] || '').trim().split(' '); addForm.names.push(first.length > 1 ? first[first.length - 1] + ' ' : ''); addForm.focus = addForm.names.length - 1; render(); var nm = document.querySelectorAll('.nm'); nm[nm.length - 1].setSelectionRange(0, 0); break;
      case 'rmName': addForm.names = readNames(); addForm.names.splice(+b.dataset.i, 1); addForm.focus = 0; render(); break;
      case 'addGo':
        var names = readNames().filter(function (n) { return C.norm(n); }); addForm.names = readNames();
        if (!names.length) { addForm.err = 'Please type a name first.'; render(); break; }
        snap = snapshot(); var guests = names.length > 1 ? C.addFamily(data, names) : [C.addGuest(data, names[0]).guest];
        addForm = null; checkInIds(guests.map(function (g) { return g.id; }), guests.length === 1 ? guests[0].name + ' added and checked in' : guests.length + ' people added and checked in');
        break;
      case 'pickName': settings.draftName = b.dataset.v; render(); break;
      case 'evGo': startEvent(); break;
      case 'evUse': settings.currentEventId = id; save(); go('checkin'); break;
      case 'evDel':
        var de = C.event(data, id), n = C.headcount(data, id).total;
        if (confirm('Delete “' + de.name + ' · ' + C.fmtDate(de.date) + '” and its ' + n + ' check-ins? You can undo right after.')) { snap = snapshot(); C.removeEvent(data, id); save(); render(); toast('Event deleted.', snap); }
        break;
      case 'backup': ToolkitBackup.save({ app: 'event-checkin', filename: 'checkin-backup-' + C.today() + '.json', data: data, settings: { org: settings.org } }); toast('Backup saved to your Downloads folder.'); break;
      case 'restore': ToolkitBackup.pick('file'); break;
      case 'rename':
        var g = C.guest(data, id), nn = prompt('Correct the name:', g.name);
        if (nn !== null) { snap = snapshot(); if (C.renameGuest(data, id, nn)) { save(); paintPeople(); toast('Name updated.', snap); } } break;
      case 'delGuest':
        var dg = C.guest(data, id);
        if (confirm('Remove ' + dg.name + ' from your list, including their past check-ins?')) { snap = snapshot(); C.removeGuest(data, id); save(); render(); toast(dg.name + ' removed.', snap); } break;
      case 'sampleReset':
        if (confirm('Replace everything with practice data? Your current records will be replaced.')) { snap = snapshot(); seedPractice(); save(); go('checkin'); toast('Practice data loaded.', snap); } break;
      case 'fresh':
        if (confirm('Erase all people, events and check-ins? Save a backup first if you may need them.')) { var fr = PD.startFresh({ data: data, settings: settings }, Object.assign({ empty: C.emptyData }, PRACTICE)); data = fr.data; save(); go('events'); toast('Everything erased, including the practice name. Start your first event.', fr.undo); } break;
    }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id !== 'file' || !e.target.files[0]) return;
    ToolkitBackup.read(e.target.files[0], function (err, bk) {
      try {
        if (err) throw err;
        var d = C.sanitize(bk.data);
        if (!d.guests.length && !d.events.length) throw new Error('empty');
        if (!confirm('Replace your current records with this backup (' + d.guests.length + ' people, ' + d.events.length + ' events)?')) return;
        var snap = snapshot(); data = d; settings.sample = false; settings.currentEventId = null; if (bk.settings.org) settings.org = bk.settings.org; save(); go('checkin'); toast('Backup restored.', snap);
      } catch (x) { toast('That file does not look like a check-in backup. Please choose a file saved with “Save a backup file”.'); }
    });
  });

  render();
  if (location.protocol.indexOf('http') === 0 && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();

</script>
</body></html>
