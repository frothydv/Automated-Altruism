<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark"><meta name="theme-color" content="#12161c"><title>Donor gifts and receipt letters</title>
<style>html{background:#12161c}</style>
<style>/* Print layout. Mark anything that should not print with class "noprint" (or "no-print"); anything only for paper with "print-only".
   Screen colors are reset to black on white so printing works from dark mode too. */
.print-only{display:none}
@media print{
  :root,:root.light{--bg:#fff;--card:#fff;--panel:#fff;--panel2:#fff;--field:#fff;--text:#000;--muted:#333;--line:#888}
  html,body{background:#fff!important;color:#000!important;font-size:12pt}
  .noprint,.no-print,nav.tabs,.toast,#toast,.modal,button{display:none!important}
  .print-only{display:block!important}
  .card,.res,tr{break-inside:avoid;box-shadow:none}
  .print-break{break-before:page}
  .print-page{break-after:page;page-break-after:always}.print-page:last-child{break-after:auto;page-break-after:auto}
  body.printing-section .print-section:not(.print-this){display:none!important}
  table{border-collapse:collapse}th,td{border:1px solid #000;padding:6px;text-align:left;vertical-align:top}
}
</style><style>:root{--bg:#12161c;--card:#1b222b;--line:#4a5663;--text:#f2f5f8;--muted:#b4bfcb;--accent:#5fd18a;--accentText:#08210f;--warn:#ffc857;--bad:#ff8a80;--field:#0e1217;--blue:#2f6fd0}
:root.light{--bg:#f6f7f4;--card:#fff;--line:#7d8893;--text:#14181d;--muted:#46505b;--accent:#1f7a45;--accentText:#fff;--warn:#8a5a00;--bad:#b3261e;--field:#fff;--blue:#1c55b0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:820px;margin:0 auto;padding:10px 14px 96px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
header.top h1{font-size:1.15rem;margin:0;flex:1;min-width:150px}
h2{font-size:1.3rem;margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.muted{color:var(--muted)}.small{font-size:.9rem}
button,.btn{font:inherit;min-height:48px;padding:10px 16px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accentText);border-color:var(--accent);font-weight:700}
button.danger{border-color:var(--bad);color:var(--bad)}
button.small{min-height:40px;padding:6px 12px;font-size:.95rem}
button.link{border:0;background:none;text-decoration:underline;min-height:44px;padding:6px}
nav.tabs{display:flex;gap:6px;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:6px;justify-content:center;z-index:5}
nav.tabs button{flex:1;max-width:200px;min-height:54px}
nav.tabs button[aria-current=page]{background:var(--accent);color:var(--accentText);border-color:var(--accent);font-weight:700}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select{font:inherit;width:100%;min-height:50px;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--field);color:var(--text)}
input.search{font-size:1.4rem;min-height:62px;border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.actions .primary{flex:1;min-height:58px;font-size:1.2rem}
.evbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.evbar b{font-size:1.1rem}
.count{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.count .num{font-size:3rem;font-weight:800;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.res{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--card)}
.res.here{border-color:var(--accent)}
.res .who{flex:1;min-width:150px}.res .who b{font-size:1.2rem}
.res .btns{display:flex;gap:8px;flex-wrap:wrap}
.res .btns .primary{min-height:52px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-weight:700;font-size:.85rem;border:2px solid var(--accent);color:var(--accent)}
.alert{border-left:6px solid var(--warn);padding:10px 14px;background:var(--card);border-radius:10px;margin:12px 0}
.alert.ok{border-left-color:var(--accent)}
.sample{background:var(--warn);color:#201500;padding:6px 12px;border-radius:10px;font-weight:600;font-size:.9rem;margin:6px 0}
:root.light .sample{background:#ffe9b0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:9;display:flex;gap:14px;align-items:center;max-width:92vw}
.toast button{min-height:40px;background:transparent;color:var(--bg);border-color:var(--bg)}
.err{color:var(--bad);font-weight:600;margin-top:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{min-height:44px}
.chips button[aria-pressed=true]{background:var(--accent);color:var(--accentText);border-color:var(--accent)}
.sr{position:absolute;left:-9999px}
.namerow{display:flex;gap:8px;margin:8px 0}.namerow input{flex:1}
ol.steps{padding-left:22px}ol.steps li{margin:6px 0}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:.9rem}
@media(max-width:560px){.row2{grid-template-columns:1fr}.count .num{font-size:2.5rem}}
textarea{font:inherit;width:100%;min-height:90px;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--field);color:var(--text)}
details{margin:10px 0}summary{cursor:pointer;min-height:44px;padding:10px 0;font-weight:600}
.sugg button{display:block;width:100%;text-align:left;margin:6px 0}
.paper{background:#fff;color:#000;border:1px solid #999;border-radius:6px;padding:28px 34px;margin:14px 0;font:12pt/1.45 Georgia,"Times New Roman",serif;overflow-x:auto}
.paper .lh{white-space:pre-line;text-align:center;font-weight:700;border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:18px}
.paper p,.paper div{margin:0 0 .8em}.paper .addr{white-space:pre-line}
.paper table{width:100%;border-collapse:collapse;margin:.8em 0}.paper th,.paper td{border-bottom:1px solid #777;padding:4px 6px;color:#000}.paper td.amt,.paper th.amt{text-align:right}
@media print{@page{margin:0.8in}.paper{border:0;padding:0;margin:0;break-after:page;page-break-after:always;overflow:visible}.paper:last-child{break-after:auto;page-break-after:auto}}
</style></head>

/* Dark/light theme toggle. Dark is the default; light adds class "light" to <html>.
   The app keeps the choice in its own settings object ({theme: 'dark'|'light'}) and saves it however it likes.
   API: ToolkitTheme.apply(theme)  ToolkitTheme.toggle(settings) -> new theme (also applies it; caller saves settings)
        ToolkitTheme.button(theme) -> html for the button, clicks are handled by the app on [data-act=theme] */

    var tc = d.querySelector('meta[name=theme-color]'); if (tc) tc.setAttribute('content', light ? '#f6f7f4' : '#12161c');
  }

  function button(theme) {

})(typeof window !== 'undefined' ? window : globalThis);

    for (i = 0; i < text.length; i++) {
      ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { c += '"'; i++; } else q = false; } else c += ch; }

/* One-click backup and restore as a small .json file (needs file-download).

/* Type-ahead search helpers. Works in the browser and in Node.

/* Donor gift log + year-end receipt letters. Pure logic, no page access; works in the browser (global Donors) and in Node.
   Data: {schemaVersion:2, donors:[{id,name,address}], gifts:[{id,donorId,date,kind:'cash'|'goods',cents,desc,returned,source,ref}]}
   source = how it arrived (Venmo, PayPal, Check, Cash...), ref = the service's transaction id (used to spot duplicates on re-import). Both optional; version 1 data had neither.

    intro: 'Thank you for your generous support of {org} in {year}. This letter is your record of what we received from you between January 1 and December 31, {year}.',
    cashNote: 'Cash gifts total {total}.',

    nothingReturned: 'No goods or services were provided to you in exchange for {these}.',

    closing: 'With gratitude,'

    else if (act === 'impAdd') {
      var pick = imp.rows.filter(function (r) { return r.on; }); snap = snapshot(); var res = IM.apply(data, imp.source, pick); save();
      toast('Added ' + res.gifts + ' gift' + (res.gifts === 1 ? '' : 's') + (res.donors ? ' and ' + res.donors + ' new donor' + (res.donors === 1 ? '' : 's') : '') + '.', snap); giftYear = pick.length ? +pick[pick.length - 1].date.slice(0, 4) : null; imp = null; go('gifts');
    }
    else if (act === 'cancelEdit') { form = fresh(); go('gifts'); }
    else if (act === 'editGift') { var g = data.gifts.filter(function (x) { return x.id === id; })[0]; form = { q: '', donorId: g.donorId, address: '', date: g.date, kind: g.kind, amount: g.kind === 'cash' ? (g.cents / 100).toFixed(2) : '', desc: g.desc, returned: g.returned, source: g.source || '', editId: g.id, err: '' }; go('log'); }
    else if (act === 'delGift') { var gg = data.gifts.filter(function (x) { return x.id === id; })[0], dn = donor(gg.donorId); if (!confirm('Delete the gift from ' + dn.name + ' on ' + C.fmtDate(gg.date) + '?')) return; snap = snapshot(); C.removeGift(data, id); save(); toast('Gift deleted.', snap); render(); }
    else if (act === 'printLetters') ToolkitPrint.print((settings.org || 'Donor') + ' year-end letters ' + (letterYear || lastYear()));
    else if (act === 'csv') ToolkitCsv.download('gifts-' + (giftYear || lastYear()) + '.csv', C.csvRows(data, giftYear || lastYear()));
    else if (act === 'csvAll') ToolkitCsv.download('all-gifts.csv', C.csvRows(data, null));
    else if (act === 'backup') { ToolkitBackup.save({ app: 'donor-receipts', filename: 'donor-gifts-backup-' + Dt.today() + '.json', data: data, settings: { org: settings.org, letterhead: settings.letterhead, signer: settings.signer, signerTitle: settings.signerTitle, ein: settings.ein, letterDate: settings.letterDate, onlyNeeded: settings.onlyNeeded, theme: settings.theme } }); toast('Backup saved to your Downloads folder.'); }
    else if (act === 'restore') ToolkitBackup.pick('file');
    else if (act === 'wordsReset') { ['intro', 'cashNote', 'goodsNote', 'nothingReturned', 'taxLine', 'closing'].forEach(function (k) { delete settings[k]; }); save(); render(); toast('Standard wording is back.'); }
    else if (act === 'editDonor') { var x = donor(id), nm = prompt('Name:', x.name); if (nm == null) return; var ad = prompt('Mailing address (use a comma between lines, leave empty for none):', (x.address || '').replace(/\n/g, ', ')); if (ad == null) return; snap = snapshot(); var r = C.renameDonor(data, id, nm, ad.split(/\s*,\s*/).join('\n')); if (r.error) return toast(r.error); save(); toast('Saved.', snap); render(); }
    else if (act === 'delDonor') { var y = donor(id), n = data.gifts.filter(function (z) { return z.donorId === id; }).length; if (!confirm('Remove ' + y.name + (n ? ' and their ' + n + ' gift' + (n === 1 ? '' : 's') : '') + '?')) return; snap = snapshot(); C.removeDonor(data, id); save(); toast(y.name + ' removed.', snap); render(); }
    else if (act === 'sampleReset') { if (!confirm('Replace everything with made-up practice donors?')) return; snap = snapshot(); var ss = settingsSnap(); seed(); toast('Practice data is back.', snap, ss); form = fresh(); go('log'); }
    else if (act === 'fresh') { if (!confirm('Clear all donors and gifts so you can start with real ones? (Your backup files are not touched. You can undo right after.)')) return; snap = snapshot(); var setSnap = settingsSnap(); data = C.emptyData(); SAMPLE.clearPractice(settings); settings.sample = false; settings.welcome = false; save(); toast('Cleared, including the practice letterhead and signer. Ready for real gifts.', snap, setSnap); form = fresh(); go('log'); }
  });
  render();
})();

</script>
